<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1320" viewBox="0 0 420 1320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">黑色语音遥控器</title>
  <desc id="description">根据参考照片绘制的透明背景纯矢量遥控器。保留电源、TV、静音、菜单、设置、方向与 OK、主页、M、返回、音量、语音及频道按键。照片未包含的底端以圆角外壳补全。</desc>
  <defs>
    <linearGradient id="body" x1="10" y1="650" x2="410" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161717"/>
      <stop offset=".055" stop-color="#222323"/>
      <stop offset=".38" stop-color="#252626"/>
      <stop offset=".72" stop-color="#222323"/>
      <stop offset=".96" stop-color="#1c1d1d"/>
      <stop offset="1" stop-color="#111212"/>
    </linearGradient>
    <linearGradient id="body-light" x1="210" y1="10" x2="210" y2="1310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".025"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".17"/>
    </linearGradient>
    <linearGradient id="button" x1="-28" y1="-40" x2="25" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303131"/>
      <stop offset=".42" stop-color="#282929"/>
      <stop offset=".84" stop-color="#252626"/>
      <stop offset="1" stop-color="#1b1c1c"/>
    </linearGradient>
    <linearGradient id="button-rim" x1="0" y1="-40" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#525353" stop-opacity=".65"/>
      <stop offset=".48" stop-color="#353636" stop-opacity=".2"/>
      <stop offset="1" stop-color="#060707" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="direction" x1="-98" y1="-142" x2="90" y2="163" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303131"/>
      <stop offset=".48" stop-color="#282929"/>
      <stop offset=".89" stop-color="#252626"/>
      <stop offset="1" stop-color="#171818"/>
    </linearGradient>
    <linearGradient id="direction-rim" x1="0" y1="-166" x2="0" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#545555" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#424343" stop-opacity=".12"/>
      <stop offset=".85" stop-color="#090a0a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#080909"/>
    </linearGradient>
    <linearGradient id="rocker" x1="-32" y1="-111" x2="35" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#313232"/>
      <stop offset=".32" stop-color="#292a2a"/>
      <stop offset=".84" stop-color="#252626"/>
      <stop offset="1" stop-color="#191a1a"/>
    </linearGradient>
    <linearGradient id="rocker-rim" x1="0" y1="-110" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555656" stop-opacity=".6"/>
      <stop offset=".3" stop-color="#363737" stop-opacity=".15"/>
      <stop offset=".8" stop-color="#373838" stop-opacity=".1"/>
      <stop offset="1" stop-color="#080909"/>
    </linearGradient>
    <radialGradient id="indicator">
      <stop stop-color="#3e4141"/>
      <stop offset=".55" stop-color="#292c2c"/>
      <stop offset="1" stop-color="#0b0d0d"/>
    </radialGradient>
    <g id="round-button">
      <circle cy="1" r="43" fill="#090a0a"/>
      <circle r="40.8" fill="url(#button)"/>
      <circle r="39.3" stroke="url(#button-rim)" stroke-width="1.3"/>
    </g>
    <g id="long-button">
      <rect x="-44" y="-113" width="88" height="228" rx="44" fill="#090a0a"/>
      <rect x="-41.3" y="-111" width="82.6" height="222" rx="41.3" fill="url(#rocker)"/>
      <rect x="-39.8" y="-109.5" width="79.6" height="219" rx="39.8" stroke="url(#rocker-rim)" stroke-width="1.3"/>
    </g>
  </defs>

  <g id="shell">
    <path d="M64 12 Q210 4 356 12 C385 14 407 33 408 61 L410 1254 C410 1287 390 1307 357 1309 Q210 1315 63 1309 C30 1307 10 1287 10 1254 L12 61 C13 33 35 14 64 12Z" fill="url(#body)" stroke="#171818" stroke-width="1.5"/>
    <path d="M64 12 Q210 4 356 12 C385 14 407 33 408 61 L410 1254 C410 1287 390 1307 357 1309 Q210 1315 63 1309 C30 1307 10 1287 10 1254 L12 61 C13 33 35 14 64 12Z" fill="url(#body-light)"/>
    <path d="M16 1225 17 63 C18 36 36 18 65 16 Q210 8 355 16" stroke="#646565" stroke-opacity=".16" stroke-width="1.1"/>
    <path d="M406 67 407 1253 C407 1284 387 1303 356 1305 Q210 1311 64 1305" stroke="#070808" stroke-opacity=".35" stroke-width="2"/>
  </g>

  <circle id="status-light" cx="210" cy="81" r="7.2" fill="url(#indicator)"/>

  <g id="power" transform="translate(88 101)">
    <use href="#round-button"/>
    <g stroke="#eeeeeb" stroke-width="4.5" stroke-linecap="square">
      <path d="M-9-10 A14.3 14.3 0 1 0 9-10"/>
      <path d="M0-14 V2"/>
    </g>
  </g>

  <g id="mute" transform="translate(88 214)">
    <use href="#round-button"/>
    <g stroke="#eeeeeb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-16-8 H-10 L0-15 V15 L-10 8 H-16 Q-20 8-20 4 V-4 Q-20-8-16-8Z"/>
      <path d="M7-7 19 7 M19-7 7 7"/>
    </g>
  </g>
  <g id="menu" transform="translate(210 213)">
    <use href="#round-button"/>
    <path d="M-16-10 H16 M-16 0 H16 M-16 10 H16" stroke="#eeeeeb" stroke-width="4.5"/>
  </g>
  <g id="settings" transform="translate(332 214)">
    <use href="#round-button"/>
    <g fill="#eeeeeb">
      <path d="M-4-18 H4 L5-13 8-12 12-15 17-10 14-6 15-3 19-2 V5 L14 6 12 9 15 13 10 18 6 15 3 16 2 20 H-5 L-6 15-9 13-13 16-18 11-15 7-16 4-20 3 V-4 L-15-5-13-8-16-12-11-17-7-14-4-15Z" transform="scale(.88)"/>
      <circle r="13.2"/>
    </g>
    <circle r="9.6" fill="#2a2b2b"/>
    <circle r="5.7" fill="#eeeeeb"/>
  </g>

  <g id="direction-pad" transform="translate(210 448)">
    <circle cy="1" r="169" fill="#080909"/>
    <circle r="166.8" fill="url(#direction)"/>
    <circle r="165" stroke="url(#direction-rim)" stroke-width="1.6"/>
    <g stroke="#eeeeeb" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
      <path id="up" d="M-17-111 0-126 17-111"/>
      <path id="left" d="M-115-17-130 0-115 17"/>
      <path id="right" d="M115-17 130 0 115 17"/>
      <path id="down" d="M-17 111 0 126 17 111"/>
    </g>
    <g id="ok">
      <circle cy="-.5" r="72" fill="#181919"/>
      <circle cy="1" r="69.5" fill="url(#button)" stroke="#111212" stroke-width="1.3"/>
      <path d="M-62 24 A67 67 0 0 1 43-51" stroke="#3b3c3c" stroke-opacity=".4" stroke-width="1.4"/>
      <g stroke="#eeeeeb" stroke-width="4.5" stroke-linejoin="round">
        <path d="M-19-15 C-29-15-31-8-31 0 S-28 16-19 16-7 9-7 0-9-15-19-15Z"/>
        <path d="M4-16 V17 M27-16 4 4 M13-4 29 17"/>
      </g>
    </g>
  </g>

  <g id="home" transform="translate(88 701)">
    <use href="#round-button"/>
    <path d="M-17-1 0-17 17-1 M-11 2 V16 H11 V2" stroke="#eeeeeb" stroke-width="3.7" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <g id="m" transform="translate(210 701)">
    <use href="#round-button"/>
    <path d="M-12 15 V-14 H-9 L0 10 9-14 H12 V15" stroke="#eeeeeb" stroke-width="4" stroke-linejoin="miter"/>
  </g>
  <g id="back" transform="translate(332 701)">
    <use href="#round-button"/>
    <path d="M-12-5 H7 C21-5 21 13 7 13 H0" stroke="#eeeeeb" stroke-width="4" stroke-linecap="square"/>
    <path d="M-20-4-4-15-6-4Z" fill="#eeeeeb"/>
  </g>

  <g id="volume" transform="translate(88 889)">
    <use href="#long-button"/>
    <path id="volume-up" d="M-14-65 H14 M0-79 V-51" stroke="#eeeeeb" stroke-width="4"/>
    <path id="volume-down" d="M-14 74 H14" stroke="#eeeeeb" stroke-width="4"/>
  </g>
  <g id="microphone" transform="translate(210 889)">
    <circle cy="1" r="50.5" fill="#090a0a"/>
    <circle r="48" fill="url(#button)"/>
    <circle r="46.6" stroke="url(#button-rim)" stroke-width="1.5"/>
    <g stroke="#00a99f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-11" y="-28" width="22" height="40" rx="11"/>
      <path d="M-17-2 V0 C-17 12-10 19 0 19 S17 12 17 0 V-2 M0 19 V29 M-10 29 H10"/>
    </g>
  </g>
  <g id="channel" transform="translate(332 889)">
    <use href="#long-button"/>
    <g stroke="#eeeeeb" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
      <path id="channel-up" d="M-16-65 0-79 16-65"/>
      <path id="channel-down" d="M-16 65 0 79 16 65"/>
    </g>
  </g>
</svg>
