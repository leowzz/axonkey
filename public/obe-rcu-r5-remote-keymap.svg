  <g id="home" transform="translate(88 584)"><use href="#button"/><path d="M-16-1 0-16 16-1 M-10 2 V15 H10 V2" stroke="#b5b2a1" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter"/></g>
