  <g id="power" transform="translate(88 93)"><use href="#button"/><g stroke="#b9b7a7" stroke-width="3.2" stroke-linecap="round"><path d="M-9-10 A13.5 13.5 0 1 0 9-10"/><path d="M0-16 V1"/></g></g>
