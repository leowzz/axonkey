<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1320" viewBox="0 0 420 1320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">OBE RCU R5 投影仪遥控器</title>
  <desc id="description">根据参考照片绘制的透明背景矢量遥控器。保留顶部电源和功能键、圆形方向键、主页、返回、菜单以及音量减和音量加按键。</desc>
  <defs>
    <linearGradient id="body" x1="10" y1="660" x2="410" y2="660" gradientUnits="userSpaceOnUse"><stop stop-color="#c7c4ad"/><stop offset=".06" stop-color="#e9e6d1"/><stop offset=".34" stop-color="#f4f1dc"/><stop offset=".68" stop-color="#eeebd5"/><stop offset=".94" stop-color="#d9d6c0"/><stop offset="1" stop-color="#aaa895"/></linearGradient>
    <linearGradient id="body-light" x1="210" y1="12" x2="210" y2="1309" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".38"/><stop offset=".35" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#8e8c7c" stop-opacity=".18"/></linearGradient>
    <linearGradient id="button" x1="-30" y1="-40" x2="30" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#f7f4df"/><stop offset=".5" stop-color="#e8e4cd"/><stop offset="1" stop-color="#c9c6ae"/></linearGradient>
    <linearGradient id="button-rim" x1="0" y1="-42" x2="0" y2="42" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".62"/><stop offset=".48" stop-color="#b8b39d" stop-opacity=".25"/><stop offset="1" stop-color="#8e8a73" stop-opacity=".72"/></linearGradient>
    <linearGradient id="direction" x1="-110" y1="-145" x2="110" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#f4f1db"/><stop offset=".52" stop-color="#e7e3cc"/><stop offset="1" stop-color="#c8c4ab"/></linearGradient>
    <radialGradient id="indicator"><stop stop-color="#3b3a30"/><stop offset=".45" stop-color="#22231f"/><stop offset="1" stop-color="#101210"/></radialGradient>
    <g id="button"><circle cy="1" r="43" fill="#aaa691" fill-opacity=".34"/><circle r="40.8" fill="url(#button)" stroke="url(#button-rim)" stroke-width="1.3"/></g>
  </defs>
  <g id="shell">
    <path d="M67 12 Q210 3 353 12 C386 14 406 35 408 67 L410 1251 C410 1287 390 1307 356 1309 Q210 1316 64 1309 C30 1307 10 1287 10 1251 L12 67 C14 35 34 14 67 12Z" fill="url(#body)" stroke="#9e9b87" stroke-width="1.5"/>
