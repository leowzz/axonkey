  <title id="title">OBE RCU R5 投影仪遥控器</title>
  <desc id="description">根据参考照片绘制的透明背景矢量遥控器。保留顶部电源和功能键、圆形方向键、主页、返回、菜单以及音量减和音量加按键。</desc>
