        <ak:match transport="bluetooth-hid" vid="0x051D5A" pid="0xC081" service="00001812-0000-1000-8000-00805F9B34FB" serial-policy="reject-ambiguous" required="true" usage-page="0x01" usage="0x06" windows-prefix="BTHLEDEVICE" />
        <ak:match transport="bluetooth-hid" vid="0x011D5A" pid="0xC081" service="00001812-0000-1000-8000-00805F9B34FB" serial-policy="reject-ambiguous" required="true" usage-page="0x01" usage="0x06" windows-prefix="BTHLEDEVICE" />
      </ak:identity>
