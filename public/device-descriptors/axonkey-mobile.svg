    <path data-ak-region="remote.mute" data-ak-anchor="78 326" d="M 54 288 H 102 Q 116 288 116 302 V 350 Q 116 364 102 364 H 54 Q 40 364 40 350 V 302 Q 40 288 54 288 Z" />
    <path data-ak-region="remote.down" data-ak-anchor="160 326" d="M 136 288 H 184 Q 198 288 198 302 V 350 Q 198 364 184 364 H 136 Q 122 364 122 350 V 302 Q 122 288 136 288 Z" />
