    <text x="225" y="399.5" fill="#f2f2f7" font-size="12" font-weight="600" text-anchor="middle">快捷 2</text>
  </g>
  <g id="key-q3" data-ak-key="remote.q3" data-ak-role="input">
    <rect x="34" y="430" width="122" height="54" rx="14" fill="#1f2025" stroke="#2e3038" stroke-width="1.15" />
    <text x="95" y="461.5" fill="#f2f2f7" font-size="12" font-weight="600" text-anchor="middle">快捷 3</text>
  </g>
  <g id="key-q4" data-ak-key="remote.q4" data-ak-role="input">
    <rect x="164" y="430" width="122" height="54" rx="14" fill="#1f2025" stroke="#2e3038" stroke-width="1.15" />
    <text x="225" y="461.5" fill="#f2f2f7" font-size="12" font-weight="600" text-anchor="middle">快捷 4</text>
  </g>

  <!-- Dedicated Voice Key (mobile.voice) -->
  <g id="key-voice" data-ak-key="mobile.voice" data-ak-role="input">
    <rect x="34" y="498" width="252" height="50" rx="15" fill="#272930" stroke="#3a3d47" stroke-width="1.3" />
    <g transform="translate(114 513)" stroke="#f2f2f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="1" width="6" height="10" rx="3" />
      <path d="M2 8.5a6 6 0 0 0 12 0" />
      <path d="M8 14.5v3.5" />
      <path d="M5.5 18h5" />
    </g>
    <text x="168" y="527.5" fill="#f2f2f7" font-size="12.5" font-weight="600" text-anchor="middle">按住说话</text>
  </g>

  <!-- Home indicator pill -->
  <rect x="124" y="562" width="72" height="4" rx="2" fill="#272930" />

