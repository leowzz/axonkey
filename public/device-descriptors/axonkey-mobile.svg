<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:ak="urn:axonkey:device:1"
     width="320" height="600" viewBox="0 0 320 600" fill="none"
     class="axonkey-mobile-svg"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-labelledby="axonkey-mobile-title axonkey-mobile-desc"
     data-ak-schema="axonkey.device/1"
     data-ak-device="axonkey.mobile"
     data-ak-revision="1">
  <title id="axonkey-mobile-title">Axonkey Mobile 手机遥控器按键示意图</title>
  <desc id="axonkey-mobile-desc">手机端 17 键智能遥控布局，含顶部 3 颗功能键、中部 3×3 方向与确认键帽、4 颗快捷指令槽位，以及底部独立按住说话语音键。</desc>
  <metadata>
    <ak:device schema="axonkey.device/1" id="axonkey.mobile" revision="1"
               vendor="Axonkey" model="Axonkey Mobile" display-name="Axonkey Mobile">
      <ak:identity>
        <ak:match transport="network" vendor-usb-hid="true" />
      </ak:identity>
      <ak:reports>
        <ak:report id="mobile" direction="input" encoding="vendor-state" engine="mobile-wss" />
      </ak:reports>
      <ak:inputs>
        <ak:input id="remote.esc" label="退出 / 中断" short="退出" icon="power" kind="button" target="#key-esc" order="1">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.menu" label="命令菜单" short="菜单" icon="menu" kind="button" target="#key-menu" order="2">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.home" label="主页 / 对话" short="主页" icon="home" kind="button" target="#key-home" order="3">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.back" label="返回" short="返回" icon="back" kind="button" target="#key-back" order="4">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.up" label="方向上" short="上" icon="up" kind="button" target="#key-up" order="5">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.vol_up" label="音量加" short="音量+" icon="volumeUp" kind="button" target="#key-vol-up" order="6">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.left" label="方向左" short="左" icon="left" kind="button" target="#key-left" order="7">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.ok" label="确认" short="OK" icon="center" kind="button" target="#key-ok" order="8">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.right" label="方向右" short="右" icon="right" kind="button" target="#key-right" order="9">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.mute" label="静音" short="静音" icon="mute" kind="button" target="#key-mute" order="10">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.down" label="方向下" short="下" icon="down" kind="button" target="#key-down" order="11">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.vol_down" label="音量减" short="音量-" icon="volumeDown" kind="button" target="#key-vol-down" order="12">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q1" label="快捷 1（继续执行）" short="Q1" icon="locate" kind="button" target="#key-q1" order="13">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q2" label="快捷 2（接受变更）" short="Q2" icon="center" kind="button" target="#key-q2" order="14">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q3" label="快捷 3（撤销）" short="Q3" icon="back" kind="button" target="#key-q3" order="15">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q4" label="快捷 4（播放/暂停）" short="Q4" icon="tv" kind="button" target="#key-q4" order="16">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="mobile.voice" label="语音键（按住说话）" short="语音" icon="mic" kind="button" target="#key-voice" order="17">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
      </ak:inputs>
      <ak:voice id="axonkey.mobile.mic" trigger-key="mobile.voice" engine="axonkey-mobile.pcm" transport="network" trigger-modes="hold click" />
    </ak:device>
  </metadata>

  <defs>
    <linearGradient id="am-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22293a" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <linearGradient id="am-dpad-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242e45" />
      <stop offset="100%" stop-color="#182032" />
    </linearGradient>
    <linearGradient id="am-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5699" />
      <stop offset="100%" stop-color="#1d3561" />
    </linearGradient>
    <linearGradient id="am-voice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#143340" />
      <stop offset="50%" stop-color="#152b44" />
      <stop offset="100%" stop-color="#17243b" />
    </linearGradient>
  </defs>

  <!-- Phone anodized chassis & OLED screen -->
  <rect x="14" y="8" width="292" height="584" rx="34" fill="url(#am-body)" stroke="#3b4963" stroke-width="2" />
  <rect x="24" y="18" width="272" height="564" rx="26" fill="#0d111a" stroke="#1e293b" stroke-width="1.2" />
  <!-- Top pill speaker -->
  <rect x="124" y="28" width="72" height="7" rx="3.5" fill="#1e293b" />

  <!-- Top Utility Row: 3 keys -->
  <g id="key-esc" data-ak-key="remote.esc" data-ak-role="input">
    <rect x="34" y="48" width="80" height="46" rx="12" fill="#28171f" stroke="#5e2b3d" stroke-width="1.25" />
    <text x="74" y="76" fill="#fda4af" font-size="13" font-weight="600" text-anchor="middle">退出</text>
  </g>
  <g id="key-menu" data-ak-key="remote.menu" data-ak-role="input">
    <rect x="120" y="48" width="80" height="46" rx="12" fill="#16233b" stroke="#2c4978" stroke-width="1.25" />
    <text x="160" y="76" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle">菜单</text>
  </g>
  <g id="key-home" data-ak-key="remote.home" data-ak-role="input">
    <rect x="206" y="48" width="80" height="46" rx="12" fill="#1a2130" stroke="#33415c" stroke-width="1.25" />
    <text x="246" y="76" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">主页</text>
  </g>

  <!-- 3x3 Square Hardware D-Pad Block -->
  <rect x="32" y="106" width="256" height="256" rx="20" fill="#121723" stroke="#232e44" stroke-width="1.2" />

  <!-- Row 1: Back | Up | Vol+ -->
  <g id="key-back" data-ak-key="remote.back" data-ak-role="input">
    <rect x="40" y="114" width="76" height="76" rx="14" fill="#192131" stroke="#2e3b55" stroke-width="1.25" />
    <text x="78" y="157" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">返回</text>
  </g>
  <g id="key-up" data-ak-key="remote.up" data-ak-role="input">
    <rect x="122" y="114" width="76" height="76" rx="14" fill="url(#am-dpad-cap)" stroke="#3d4e70" stroke-width="1.25" />
    <path d="M160 143L169 156H151L160 143Z" fill="#f8fafc" />
  </g>
  <g id="key-vol-up" data-ak-key="remote.vol_up" data-ak-role="input">
    <rect x="204" y="114" width="76" height="76" rx="14" fill="#192131" stroke="#2e3b55" stroke-width="1.25" />
    <text x="242" y="157" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">音量+</text>
  </g>

  <!-- Row 2: Left | OK | Right -->
  <g id="key-left" data-ak-key="remote.left" data-ak-role="input">
    <rect x="40" y="196" width="76" height="76" rx="14" fill="url(#am-dpad-cap)" stroke="#3d4e70" stroke-width="1.25" />
    <path d="M69 234L82 225V243L69 234Z" fill="#f8fafc" />
  </g>
  <g id="key-ok" data-ak-key="remote.ok" data-ak-role="input">
    <rect x="122" y="196" width="76" height="76" rx="14" fill="url(#am-ok)" stroke="#4f8ff7" stroke-width="1.6" />
    <text x="160" y="240" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">OK</text>
  </g>
  <g id="key-right" data-ak-key="remote.right" data-ak-role="input">
    <rect x="204" y="196" width="76" height="76" rx="14" fill="url(#am-dpad-cap)" stroke="#3d4e70" stroke-width="1.25" />
    <path d="M251 234L238 225V243L251 234Z" fill="#f8fafc" />
  </g>

  <!-- Row 3: Mute | Down | Vol- -->
  <g id="key-mute" data-ak-key="remote.mute" data-ak-role="input">
    <rect x="40" y="278" width="76" height="76" rx="14" fill="#192131" stroke="#2e3b55" stroke-width="1.25" />
    <text x="78" y="321" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">静音</text>
  </g>
  <g id="key-down" data-ak-key="remote.down" data-ak-role="input">
    <rect x="122" y="278" width="76" height="76" rx="14" fill="url(#am-dpad-cap)" stroke="#3d4e70" stroke-width="1.25" />
    <path d="M160 325L169 312H151L160 325Z" fill="#f8fafc" />
  </g>
  <g id="key-vol-down" data-ak-key="remote.vol_down" data-ak-role="input">
    <rect x="204" y="278" width="76" height="76" rx="14" fill="#192131" stroke="#2e3b55" stroke-width="1.25" />
    <text x="242" y="321" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">音量-</text>
  </g>

  <!-- 2x2 Quick Action Slots -->
  <g id="key-q1" data-ak-key="remote.q1" data-ak-role="input">
    <rect x="34" y="374" width="122" height="54" rx="13" fill="#152238" stroke="#294673" stroke-width="1.25" />
    <text x="95" y="406" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle">快捷 1</text>
  </g>
  <g id="key-q2" data-ak-key="remote.q2" data-ak-role="input">
    <rect x="164" y="374" width="122" height="54" rx="13" fill="#122822" stroke="#215747" stroke-width="1.25" />
    <text x="225" y="406" fill="#6ee7b7" font-size="13" font-weight="600" text-anchor="middle">快捷 2</text>
  </g>
  <g id="key-q3" data-ak-key="remote.q3" data-ak-role="input">
    <rect x="34" y="436" width="122" height="54" rx="13" fill="#271f14" stroke="#574221" stroke-width="1.25" />
    <text x="95" y="468" fill="#fcd34d" font-size="13" font-weight="600" text-anchor="middle">快捷 3</text>
  </g>
  <g id="key-q4" data-ak-key="remote.q4" data-ak-role="input">
    <rect x="164" y="436" width="122" height="54" rx="13" fill="#1f1832" stroke="#453273" stroke-width="1.25" />
    <text x="225" y="468" fill="#c4b5fd" font-size="13" font-weight="600" text-anchor="middle">快捷 4</text>
  </g>

  <!-- Dedicated First-Class Voice Key (mobile.voice) -->
  <g id="key-voice" data-ak-key="mobile.voice" data-ak-role="input">
    <rect x="34" y="504" width="252" height="54" rx="15" fill="url(#am-voice)" stroke="#2d6a7d" stroke-width="1.4" />
    <g transform="translate(106 521)" stroke="#5eead4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="1" width="6" height="10" rx="3" />
      <path d="M2 8.5a6 6 0 0 0 12 0" />
      <path d="M8 14.5v3.5" />
      <path d="M5.5 18h5" />
    </g>
    <text x="174" y="536" fill="#ccfbf1" font-size="13" font-weight="600" text-anchor="middle">语音键 · 按住说话</text>
  </g>

  <!-- Home indicator pill -->
  <rect x="124" y="569" width="72" height="4" rx="2" fill="#1e293b" />

