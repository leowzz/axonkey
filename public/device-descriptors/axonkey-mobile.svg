    <text x="160" y="205" fill="#f2f2f7" font-size="14.5" font-weight="650" text-anchor="middle">OK</text>
  </g>
  <g id="key-right" data-ak-key="remote.right" data-ak-role="input">
    <path d="M 224.15 144.23 A 85 85 0 0 1 224.15 255.77 L 191.7 227.55 A 42 42 0 0 0 191.7 172.45 Z" fill="transparent" />
    <path d="M 221 194.5 L 226.5 200 L 221 205.5" stroke="#f2f2f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g id="key-down" data-ak-key="remote.down" data-ak-role="input">
    <path d="M 215.77 264.13 A 85 85 0 0 1 104.23 264.13 L 132.45 231.7 A 42 42 0 0 0 187.55 231.7 Z" fill="transparent" />
    <path d="M 154.5 261 L 160 266.5 L 165.5 261" stroke="#f2f2f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Zone 3: Media & Navigation Row (4 cols) -->
  <g id="key-back" data-ak-key="remote.back" data-ak-role="input">
    <rect x="34" y="310" width="57" height="46" rx="12" fill="#1f2025" stroke="#2e3038" stroke-width="1.15" />
    <text x="62.5" y="337.5" fill="#f2f2f7" font-size="11" font-weight="600" text-anchor="middle">返回</text>
  </g>
  <g id="key-mute" data-ak-key="remote.mute" data-ak-role="input">
