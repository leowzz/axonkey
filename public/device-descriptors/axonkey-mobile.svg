    <path data-ak-region="remote.menu" data-ak-anchor="160 71" d="M 132 48 H 188 A 12 12 0 0 1 200 60 V 82 A 12 12 0 0 1 188 94 H 132 A 12 12 0 0 1 120 82 V 60 A 12 12 0 0 1 132 48 Z" />
    <path data-ak-region="remote.home" data-ak-anchor="246 71" d="M 218 48 H 274 A 12 12 0 0 1 286 60 V 82 A 12 12 0 0 1 274 94 H 218 A 12 12 0 0 1 206 82 V 60 A 12 12 0 0 1 218 48 Z" />

