    <path data-ak-region="remote.ok" data-ak-anchor="160 234" d="M 136 196 H 184 A 14 14 0 0 1 198 210 V 258 A 14 14 0 0 1 184 272 H 136 A 14 14 0 0 1 122 258 V 210 A 14 14 0 0 1 136 196 Z" />
    <path data-ak-region="remote.right" data-ak-anchor="242 234" d="M 218 196 H 266 A 14 14 0 0 1 280 210 V 258 A 14 14 0 0 1 266 272 H 218 A 14 14 0 0 1 204 258 V 210 A 14 14 0 0 1 218 196 Z" />

    <path data-ak-region="remote.mute" data-ak-anchor="78 316" d="M 54 278 H 102 A 14 14 0 0 1 116 292 V 340 A 14 14 0 0 1 102 354 H 54 A 14 14 0 0 1 40 340 V 292 A 14 14 0 0 1 54 278 Z" />
