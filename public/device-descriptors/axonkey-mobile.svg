    <path data-ak-region="remote.q1" data-ak-anchor="95 401" d="M 47 374 H 143 A 13 13 0 0 1 156 387 V 415 A 13 13 0 0 1 143 428 H 47 A 13 13 0 0 1 34 415 V 387 A 13 13 0 0 1 47 374 Z" />
