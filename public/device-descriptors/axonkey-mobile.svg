<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:ak="urn:axonkey:device:1"
     width="320" height="580" viewBox="0 0 320 580" fill="none"
     class="axonkey-mobile-svg"
     role="img" aria-labelledby="axonkey-mobile-title axonkey-mobile-desc"
     data-ak-schema="axonkey.device/1"
     data-ak-device="axonkey.mobile"
     data-ak-revision="1">
  <title id="axonkey-mobile-title">Axonkey Mobile 手机遥控器按键示意图</title>
  <desc id="axonkey-mobile-desc">手机端 16 键方形经典遥控器布局，含顶部 3 颗功能键、中部 3×3 方向与确认键帽、底部 4 颗快捷槽位，并支持局域网语音麦克风。</desc>
  <metadata>
    <ak:device schema="axonkey.device/1" id="axonkey.mobile" revision="1"
               vendor="Axonkey" model="Axonkey Mobile" display-name="Axonkey Mobile">
      <ak:identity>
        <ak:match transport="network" vendor-usb-hid="true" />
      </ak:identity>
      <ak:reports>
        <ak:report id="mobile" direction="input" encoding="vendor-state" engine="mobile-wss" />
      </ak:reports>
      <ak:inputs>
        <ak:input id="remote.esc" label="退出 / 中断" short="退出" icon="power" kind="button" target="#key-esc" order="1">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.menu" label="命令菜单" short="菜单" icon="menu" kind="button" target="#key-menu" order="2">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.home" label="主页 / 对话" short="主页" icon="home" kind="button" target="#key-home" order="3">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.back" label="返回" short="返回" icon="back" kind="button" target="#key-back" order="4">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.up" label="上" short="上" icon="up" kind="button" target="#key-up" order="5">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.vol_up" label="音量加" short="音量+" icon="vol-up" kind="button" target="#key-vol-up" order="6">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.left" label="左" short="左" icon="left" kind="button" target="#key-left" order="7">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.ok" label="确认" short="OK" icon="ok" kind="button" target="#key-ok" order="8">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.right" label="右" short="右" icon="right" kind="button" target="#key-right" order="9">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.mute" label="静音" short="静音" icon="mute" kind="button" target="#key-mute" order="10">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.down" label="下" short="下" icon="down" kind="button" target="#key-down" order="11">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.vol_down" label="音量减" short="音量-" icon="vol-down" kind="button" target="#key-vol-down" order="12">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q1" label="快捷 1（继续执行）" short="Q1" icon="spark" kind="button" target="#key-q1" order="13">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q2" label="快捷 2（接受变更）" short="Q2" icon="check" kind="button" target="#key-q2" order="14">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q3" label="快捷 3（撤销）" short="Q3" icon="back" kind="button" target="#key-q3" order="15">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q4" label="快捷 4（播放/暂停）" short="Q4" icon="play" kind="button" target="#key-q4" order="16">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
      </ak:inputs>
      <ak:voice id="axonkey.mobile.mic" trigger-key="remote.q4" engine="axonkey-mobile.pcm" transport="network" trigger-modes="hold click" />
    </ak:device>
  </metadata>

  <defs>
    <linearGradient id="am-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2433" />
      <stop offset="100%" stop-color="#11151f" />
    </linearGradient>
    <linearGradient id="am-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283d66" />
      <stop offset="100%" stop-color="#1b2944" />
    </linearGradient>
  </defs>

  <!-- Phone chassis -->
  <rect x="14" y="10" width="292" height="560" rx="34" fill="url(#am-body)" stroke="#334155" stroke-width="2" />
  <rect x="24" y="20" width="272" height="540" rx="26" fill="#0e121b" stroke="#1e293b" stroke-width="1.2" />
  <!-- Top pill notch -->
  <rect x="122" y="30" width="76" height="8" rx="4" fill="#1e293b" />

  <!-- Top Utility Row: 3 keys -->
  <g id="key-esc" data-ak-key="remote.esc" data-ak-role="input">
    <rect x="34" y="54" width="80" height="48" rx="12" fill="#25161c" stroke="#522636" stroke-width="1.2" />
    <text x="74" y="82" fill="#fda4af" font-size="13" font-weight="600" text-anchor="middle">退出</text>
  </g>
  <g id="key-menu" data-ak-key="remote.menu" data-ak-role="input">
    <rect x="120" y="54" width="80" height="48" rx="12" fill="#152035" stroke="#263e66" stroke-width="1.2" />
    <text x="160" y="82" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle">菜单</text>
  </g>
  <g id="key-home" data-ak-key="remote.home" data-ak-role="input">
    <rect x="206" y="54" width="80" height="48" rx="12" fill="#181e2c" stroke="#2c364d" stroke-width="1.2" />
    <text x="246" y="82" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">主页</text>
  </g>

  <!-- 3x3 Square Hardware D-Pad Block -->
  <rect x="32" y="116" width="256" height="256" rx="20" fill="#131824" stroke="#242e42" stroke-width="1.2" />

  <!-- Row 1: Back | Up | Vol+ -->
  <g id="key-back" data-ak-key="remote.back" data-ak-role="input">
    <rect x="40" y="124" width="76" height="76" rx="14" fill="#19202f" stroke="#2d384f" stroke-width="1.2" />
    <text x="78" y="166" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">返回</text>
  </g>
  <g id="key-up" data-ak-key="remote.up" data-ak-role="input">
    <rect x="122" y="124" width="76" height="76" rx="14" fill="#1f2739" stroke="#364461" stroke-width="1.2" />
    <text x="160" y="169" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">▲</text>
  </g>
  <g id="key-vol-up" data-ak-key="remote.vol_up" data-ak-role="input">
    <rect x="204" y="124" width="76" height="76" rx="14" fill="#19202f" stroke="#2d384f" stroke-width="1.2" />
    <text x="242" y="166" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">音量+</text>
  </g>

  <!-- Row 2: Left | OK | Right -->
  <g id="key-left" data-ak-key="remote.left" data-ak-role="input">
    <rect x="40" y="206" width="76" height="76" rx="14" fill="#1f2739" stroke="#364461" stroke-width="1.2" />
    <text x="78" y="251" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">◀</text>
  </g>
  <g id="key-ok" data-ak-key="remote.ok" data-ak-role="input">
    <rect x="122" y="206" width="76" height="76" rx="14" fill="url(#am-ok)" stroke="#3b82f6" stroke-width="1.6" />
    <text x="160" y="250" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">OK</text>
  </g>
  <g id="key-right" data-ak-key="remote.right" data-ak-role="input">
    <rect x="204" y="206" width="76" height="76" rx="14" fill="#1f2739" stroke="#364461" stroke-width="1.2" />
    <text x="242" y="251" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">▶</text>
  </g>

  <!-- Row 3: Mute | Down | Vol- -->
  <g id="key-mute" data-ak-key="remote.mute" data-ak-role="input">
    <rect x="40" y="288" width="76" height="76" rx="14" fill="#19202f" stroke="#2d384f" stroke-width="1.2" />
    <text x="78" y="330" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">静音</text>
  </g>
  <g id="key-down" data-ak-key="remote.down" data-ak-role="input">
    <rect x="122" y="288" width="76" height="76" rx="14" fill="#1f2739" stroke="#364461" stroke-width="1.2" />
    <text x="160" y="333" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">▼</text>
  </g>
  <g id="key-vol-down" data-ak-key="remote.vol_down" data-ak-role="input">
    <rect x="204" y="288" width="76" height="76" rx="14" fill="#19202f" stroke="#2d384f" stroke-width="1.2" />
    <text x="242" y="330" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">音量-</text>
  </g>

  <!-- Bottom 2x2 Quick Slots -->
  <g id="key-q1" data-ak-key="remote.q1" data-ak-role="input">
    <rect x="34" y="388" width="122" height="58" rx="14" fill="#152035" stroke="#263e66" stroke-width="1.2" />
    <text x="95" y="421" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle">快捷 1</text>
  </g>
  <g id="key-q2" data-ak-key="remote.q2" data-ak-role="input">
    <rect x="164" y="388" width="122" height="58" rx="14" fill="#122620" stroke="#1f4d3f" stroke-width="1.2" />
    <text x="225" y="421" fill="#6ee7b7" font-size="13" font-weight="600" text-anchor="middle">快捷 2</text>
  </g>
  <g id="key-q3" data-ak-key="remote.q3" data-ak-role="input">
    <rect x="34" y="454" width="122" height="58" rx="14" fill="#261e13" stroke="#4f3d1f" stroke-width="1.2" />
    <text x="95" y="487" fill="#fcd34d" font-size="13" font-weight="600" text-anchor="middle">快捷 3</text>
  </g>
  <g id="key-q4" data-ak-key="remote.q4" data-ak-role="input">
    <rect x="164" y="454" width="122" height="58" rx="14" fill="#1e172f" stroke="#3e2d66" stroke-width="1.2" />
    <text x="225" y="487" fill="#c4b5fd" font-size="13" font-weight="600" text-anchor="middle">快捷 4</text>
  </g>

  <!-- Bottom voice/text dock decoration -->
  <rect x="34" y="524" width="252" height="24" rx="12" fill="#141925" stroke="#242e42" stroke-width="1" />
  <text x="160" y="540" fill="#64748b" font-size="10" text-anchor="middle">文本 / 语音输入栏</text>

