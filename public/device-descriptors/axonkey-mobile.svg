<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:ak="urn:axonkey:device:1"
     width="320" height="598" viewBox="0 0 320 598" fill="none"
     class="axonkey-mobile-svg"
     font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-labelledby="axonkey-mobile-title axonkey-mobile-desc"
     data-ak-schema="axonkey.device/1"
     data-ak-device="axonkey.mobile"
     data-ak-revision="1">
  <title id="axonkey-mobile-title">Axonkey Mobile 手机遥控器按键示意图</title>
  <desc id="axonkey-mobile-desc">手机端一体化深空灰智能遥控布局，含顶部 3 颗功能键、中部同心触控圆盘、4 颗媒体控制键、4 颗快捷按键，以及底部按住说话语音键。</desc>
  <metadata>
    <ak:device schema="axonkey.device/1" id="axonkey.mobile" revision="1"
               vendor="Axonkey" model="Axonkey Mobile" display-name="Axonkey Mobile">
      <ak:identity>
        <ak:match transport="network" vendor-usb-hid="true" />
      </ak:identity>
      <ak:reports>
        <ak:report id="mobile" direction="input" encoding="vendor-state" engine="mobile-wss" />
      </ak:reports>
      <ak:inputs>
        <ak:input id="remote.esc" label="退出 / 中断" short="退出" icon="power" kind="button" target="#key-esc" order="1">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.menu" label="命令菜单" short="菜单" icon="menu" kind="button" target="#key-menu" order="2">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.home" label="主页 / 对话" short="主页" icon="home" kind="button" target="#key-home" order="3">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.up" label="方向上" short="上" icon="up" kind="button" target="#key-up" order="4">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.left" label="方向左" short="左" icon="left" kind="button" target="#key-left" order="5">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.ok" label="确认" short="OK" icon="center" kind="button" target="#key-ok" order="6">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.right" label="方向右" short="右" icon="right" kind="button" target="#key-right" order="7">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.down" label="方向下" short="下" icon="down" kind="button" target="#key-down" order="8">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.back" label="返回" short="返回" icon="back" kind="button" target="#key-back" order="9">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.mute" label="静音" short="静音" icon="mute" kind="button" target="#key-mute" order="10">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.vol_down" label="音量减" short="音量-" icon="volumeDown" kind="button" target="#key-vol-down" order="11">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.vol_up" label="音量加" short="音量+" icon="volumeUp" kind="button" target="#key-vol-up" order="12">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q1" label="快捷 1（继续执行）" short="Q1" icon="locate" kind="button" target="#key-q1" order="13">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q2" label="快捷 2（接受变更）" short="Q2" icon="center" kind="button" target="#key-q2" order="14">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q3" label="快捷 3（撤销）" short="Q3" icon="back" kind="button" target="#key-q3" order="15">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="remote.q4" label="快捷 4（播放/暂停）" short="Q4" icon="tv" kind="button" target="#key-q4" order="16">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
        <ak:input id="mobile.voice" label="语音键（按住说话）" short="语音" icon="mic" kind="button" target="#key-voice" order="17">
          <ak:source report="mobile" engine="mobile-wss" />
        </ak:input>
      </ak:inputs>
      <ak:voice id="axonkey.mobile.mic" trigger-key="mobile.voice" engine="axonkey-mobile.pcm" transport="network" trigger-modes="hold click" />
    </ak:device>
  </metadata>

  <defs>
    <linearGradient id="am-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272930" />
      <stop offset="100%" stop-color="#18191e" />
    </linearGradient>
    <linearGradient id="am-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25272f" />
      <stop offset="100%" stop-color="#1c1d23" />
    </linearGradient>
    <linearGradient id="am-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3039" />
      <stop offset="100%" stop-color="#21232a" />
    </linearGradient>
  </defs>

  <!-- Machined space-gray aluminum chassis & OLED screen -->
  <rect x="14" y="8" width="292" height="582" rx="34" fill="url(#am-body)" stroke="#383b44" stroke-width="1.8" />
  <rect x="24" y="18" width="272" height="562" rx="26" fill="#141518" stroke="#22242b" stroke-width="1.2" />
  <rect x="128" y="25" width="64" height="5" rx="2.5" fill="#272930" />

  <!-- Zone 1: Top Utility Row (3 cols) -->
  <g id="key-esc" data-ak-key="remote.esc" data-ak-role="input">
    <rect x="34" y="44" width="78.67" height="46" rx="12" fill="#1f2025" stroke="#2e3038" stroke-width="1.15" />
    <text x="73.33" y="71.5" fill="#f2f2f7" font-size="12" font-weight="600" text-anchor="middle">退出</text>
  </g>
  <g id="key-menu" data-ak-key="remote.menu" data-ak-role="input">
    <rect x="120.67" y="44" width="78.67" height="46" rx="12" fill="#1f2025" stroke="#2e3038" stroke-width="1.15" />
    <text x="160" y="71.5" fill="#f2f2f7" font-size="12" font-weight="600" text-anchor="middle">菜单</text>
  </g>
  <g id="key-home" data-ak-key="remote.home" data-ak-role="input">
    <rect x="207.33" y="44" width="78.67" height="46" rx="12" fill="#1f2025" stroke="#2e3038" stroke-width="1.15" />
    <text x="246.67" y="71.5" fill="#f2f2f7" font-size="12" font-weight="600" text-anchor="middle">主页</text>
  </g>

  <!-- Zone 2: Concentric Circular Tactile Clickpad Ring (触控圆盘, cy=200) -->
  <g class="am-clickpad-ring">
    <circle cx="160" cy="200" r="92" fill="#191a1f" stroke="#25272e" stroke-width="1.2" />
    <circle cx="160" cy="200" r="88" fill="url(#am-ring)" stroke="#3a3d47" stroke-width="1.4" />
    <circle cx="160" cy="200" r="40" fill="#141518" stroke="#2e3038" stroke-width="1" />
  </g>
