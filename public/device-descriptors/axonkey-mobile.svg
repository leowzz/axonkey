    <text x="257.5" y="337.5" fill="#f2f2f7" font-size="11" font-weight="600" text-anchor="middle">音量+</text>
  </g>

  <!-- Zone 4: 2x2 Quick Action Slots -->
  <g id="key-q1" data-ak-key="remote.q1" data-ak-role="input">
    <rect x="34" y="368" width="122" height="54" rx="14" fill="#1f2025" stroke="#2e3038" stroke-width="1.15" />
    <text x="95" y="399.5" fill="#f2f2f7" font-size="12" font-weight="600" text-anchor="middle">快捷 1</text>
  </g>
  <g id="key-q2" data-ak-key="remote.q2" data-ak-role="input">
