    <path data-ak-region="remote.home" data-ak-anchor="246 78" d="M 218 54 H 274 Q 286 54 286 66 V 90 Q 286 102 274 102 H 218 Q 206 102 206 90 V 66 Q 206 54 218 54 Z" />

    <path data-ak-region="remote.back" data-ak-anchor="78 162" d="M 54 124 H 102 Q 116 124 116 138 V 186 Q 116 200 102 200 H 54 Q 40 200 40 186 V 138 Q 40 124 54 124 Z" />
    <path data-ak-region="remote.up" data-ak-anchor="160 162" d="M 136 124 H 184 Q 198 124 198 138 V 186 Q 198 200 184 200 H 136 Q 122 200 122 186 V 138 Q 122 124 136 124 Z" />
