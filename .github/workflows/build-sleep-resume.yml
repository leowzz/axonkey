name: Build sleep resume fix

on:
  push:
    branches: [codex/build-sleep-resume]

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Rust code
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib input_service
      - name: Build Axonkey
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Axonkey-sleep-resume-windows
          path: |
            src-tauri/target/release/axonkey.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
