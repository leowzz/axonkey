  <style>
.controller { font-family: 'Manrope', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.controller .hit { fill: #343d48; stroke: #222d38; stroke-width: 1.5; }
.controller .direction .hit { fill: #e8edf1; stroke: #ccd5dd; stroke-width: 1; }
.controller .chevron { fill: none; stroke: #8b9aa8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.controller .key text { fill: #e9eef2; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.controller .key text.face-a { fill: #70cc74; font-size: 22px; }
.controller .key text.face-b { fill: #ef7b7b; font-size: 22px; }
.controller .key text.face-x { fill: #6db6ee; font-size: 22px; }
.controller .key text.face-y { fill: #eace6a; font-size: 22px; }
.controller .port { fill: #7b8998; }
</style>
