<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" class="controller" role="img" aria-labelledby="xbox-keymap-title xbox-keymap-description">
  <title id="xbox-keymap-title">无线手柄按键示意图</title>
  <desc id="xbox-keymap-description">正面按键、顶部肩键与扳机、左右摇杆和方向区域。中心使用通用主键图标。分享键为可选区域，默认隐藏。</desc>
  <style>
svg.controller {
  --key: #343d48;
  --key-edge: #222d38;
  --blue: #1478e8;
  --blue-soft: #e2efff;
  --green: #24975e;
  font-family: 'Manrope', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
.controller text{font-family:inherit;pointer-events:none;user-select:none}
.controller .key{cursor:pointer;outline:none}
.controller .key .hit{fill:var(--key);stroke:var(--key-edge);stroke-width:1.5;transition:fill .12s,stroke .12s}
.controller .key .halo{fill:none;stroke:transparent;stroke-width:3;transition:stroke .12s}
.controller .key:hover .halo,.controller .key:focus-visible .halo{stroke:#8cbcf0}
.controller .key.selected .halo{stroke:var(--blue);stroke-width:3.5}
.controller .key.selected .hit{fill:#26527d;stroke:#1678dc}
.controller .key.pressed .hit{fill:#266b48;stroke:#36bc77}
.controller .key.pressed .halo{stroke:#36bc77;stroke-width:4}
.controller .key .mapped-dot{fill:var(--blue);stroke:#fff;stroke-width:2;visibility:hidden}
.controller .key.mapped .mapped-dot{visibility:visible}
.controller .key text{fill:#e9eef2;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.controller .key[data-key="a"] text{fill:#70cc74;font-size:22px}
.controller .key[data-key="b"] text{fill:#ef7b7b;font-size:22px}
.controller .key[data-key="x"] text{fill:#6db6ee;font-size:22px}
.controller .key[data-key="y"] text{fill:#eace6a;font-size:22px}
.controller .direction .hit{fill:#e8edf1;stroke:#ccd5dd;stroke-width:1}
.controller .direction .chevron{stroke:#8b9aa8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.controller .direction.selected .hit{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.controller .direction.selected .chevron{stroke:var(--blue)}
.controller .direction.pressed .hit{fill:#cef1dc;stroke:var(--green)}
.controller .key.unverified{opacity:.6}
.controller .callout{fill:#7a8998;font-size:11px;letter-spacing:.3px}
.controller .callout-line{stroke:#b8c6d2;stroke-width:1;fill:none}
.controller .port{fill:#7b8998}
.controller .direction .halo{stroke-width:2}
.controller .direction:hover .hit,.controller .direction:focus-visible .hit{stroke:var(--blue);stroke-width:2}
.controller [data-key="share"] { display: none; }
.controller.show-share [data-key="share"] { display: inline; }
@media (prefers-reduced-motion: reduce) {
  .controller .key .hit, .controller .key .halo { transition: none; }
}
</style>
