      <stop stop-color="#fafcfd" />
      <stop offset=".5" stop-color="#edf1f4" />
      <stop offset="1" stop-color="#d4dce3" />
    </linearGradient>
    <linearGradient id="xbox-keymap-grip-fill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e2e8ed" />
      <stop offset="1" stop-color="#c1cbd4" />
    </linearGradient>
    <filter id="xbox-keymap-body-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#455b70" flood-opacity=".14" />
    </filter>
  </defs>
