[package]
name = "axonkey"
version = "1.0.12"
description = "Axonkey RC003 key mapping editor"
authors = ["Axonkey"]
edition = "2021"

[lib]
name = "axonkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }
# Used by the macOS Objective-C adapters, independently of the Windows HID client.
cc = "1"
prost-build = "0.14"
protox = "0.10"

[dependencies]
tauri = { version = "2.8.3", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2.9.1"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
winreg = "0.55"
cpal = "0.18.2"
windows = { version = "0.61.3", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Foundation",
  "Storage_Streams",
  "Win32_System_Com",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1", features = ["time"] }
