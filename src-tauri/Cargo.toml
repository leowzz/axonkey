[package]
name = "axonkey"
version = "0.1.9"
description = "Axonkey RC003 key mapping editor"
authors = ["Axonkey"]
edition = "2021"

[lib]
name = "axonkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
