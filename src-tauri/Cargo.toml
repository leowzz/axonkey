[package]
name = "axonkey"
version = "0.1.29"
description = "Axonkey RC003 key mapping editor"
authors = ["Axonkey"]
edition = "2021"

[lib]
name = "axonkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2.8.3", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2.9.1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
windows = { version = "0.61.3", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Foundation",
  "Storage_Streams",
  "Win32_System_Com",
] }
