<div class="intro"><div><h1>先选设备，再编辑它的配置。</h1><p>设备卡片是最外层入口。每台设备拥有自己的配置文件，进入后继续使用熟悉的泳道。</p></div><span class="prototype-label">交互原型 · 示例数据</span></div>

<div class="bottom-notes" id="notes"></div>
<p class="source-note">复用现有三列泳道、动作顺序和行为库；本轮将配置文件归属调整为每台设备独立管理。应用配置为未来设计，设备集成与硬件输入均为模拟。<br>系统鼠标仍是共用输入源；每台遥控器、手柄或自定义设备拥有独立配置。已保存序列可跨设备插入副本。<a href="multi-device-v2.html">上一版原型</a></p>

function renderWorkbench(){const d=selectedDevice(),p=selectedProfile(),c=selectedControl();return`<main class="work-area"><div class="edit-context"><div class="edit-breadcrumb"><span>正在编辑</span><strong>${esc(p.name)}</strong>${icon('chevron')}<strong>${esc(scopeName(state.editScope))}</strong>${state.editScope!=='base'?'<span class="scope-badge future">应用配置 · 未来</span>':''}</div></div>${renderScopeTabs()}${!state.masterEnabled?'<div class="notice">'+icon('info')+'<span>软件已暂停，仍可编辑配置。</span></div>':renderNotice(d)}${state.editScope!=='base'?`<div class="scope-explanation">${icon('link')}<span>未覆盖的泳道继承通用配置；覆盖后整条独立执行。</span><button data-action="app-rule">应用匹配规则</button></div>`:''}<div class="key-heading"><h2>${esc(inputLabel(c,controlsFor(d)))}</h2><div class="tools"><label class="key-picker-field">按键<select class="control-selector" aria-label="选择设备输入">${controlsFor(d).map(c=>`<option value="${esc(c[0])}" ${c[0]===state.control?'selected':''}>${esc(inputLabel(c,controlsFor(d)))}</option>`).join('')}</select></label><div class="undo-toolbar"><button class="icon-btn" data-action="undo" aria-label="撤销" title="撤销" ${state.history.length?'':'disabled'}>${icon('undo')}</button><button class="icon-btn" data-action="redo" aria-label="重做" title="重做" ${state.future.length?'':'disabled'}>${icon('redo')}</button></div></div></div>${d.type==='mouse'?`<div class="mouse-scope-row">生效区域 <select id="mouse-scope" aria-label="鼠标生效区域">${allowedMouseScopes().map(v=>`<option value="${v}" ${v===state.mouseScope?'selected':''}>${{global:'任意位置',top:'上边缘',left:'左边缘',right:'右边缘'}[v]}</option>`).join('')}</select><span>${['buttonForward','buttonBack'].includes(state.control)?'边缘未配置时，逐触发继承任意位置':'此输入只在屏幕边缘生效'}</span></div>`:''}<div class="workflow-area"><div class="flow-canvas"><div class="lanes" style="grid-template-columns:repeat(${triggers(c).length},minmax(0,1fr))">${triggers(c).map(([id,label])=>renderLane(id,label)).join('')}</div><footer class="canvas-footer"><div class="trash-bin" data-trash>${icon('trash')}拖入删除</div><span class="canvas-footnote">动作自上而下执行 · 已保存序列插入为副本</span></footer></div>${renderToolbox()}</div></main>`}
function renderNotes(){document.getElementById('notes').innerHTML=[['第一层 · 设备','总览平铺所有设备','卡片展示连接状态、当前生效配置与配置数量。点击整张卡片进入设备编辑页。'],['第二层 · 配置文件','每台设备各自管理','切换、复制、删除或导入配置，只作用于当前设备。同型号的两台设备也互不影响。'],['第三层 · 应用与泳道','复用原来的编辑方式','通用配置与应用覆盖都留在这台设备下；单击、双击、长按和右侧行为库保持一致。']].map(([l,h,p])=>`<section><div class="note-label">${l}</div><h3>${h}</h3><p>${p}</p></section>`).join('')}
function render(){normalizeSelection();saveDeviceContext();app.innerHTML=renderGlobalNav()+`<div class="product-shell">${renderHeader()}<div class="prototype-body">${renderContextRail()}${state.view==='library'?renderLibrary():state.view==='integrations'?renderIntegrations():renderWorkbench()}</div></div>`;renderNotes()}

function renderNotice(d){if(d.integration!=='ready')return `<div class="notice">${icon('alert')}<span>${d.integration==='verifying'?'设备支持已就绪，还需确认输入来自这台设备。':d.integration==='restart'?'设备支持已准备好，重启后还需确认输入正常。':d.integration==='failed'?'设备集成尚未完成，当前不会启用映射。':'这台设备还需要完成首次集成。'}</span><button class="btn" data-action="resume-integration">${d.integration==='restart'?'查看进度':'继续集成'}</button></div>`;if(!d.online)return `<div class="notice neutral">${icon('info')}<span>设备暂未连接。仍可编辑泳道，重新连接后使用当前配置文件。</span><button class="btn" data-action="reconnect">模拟重新连接</button></div>`;if(!d.enabled)return `<div class="notice neutral">${icon('info')}<span>这台设备的自定义输入源已暂停；保存的配置仍然保留。</span></div>`;return ''}
function renderLibrary(){return`<main class="device-overview"><header class="device-overview-heading"><div><h2>我的设备 <span>${state.devices.length}</span></h2><p>选择一台设备，管理它的配置文件和输入映射。</p></div><button class="btn primary" data-action="add">${icon('plus')}集成设备</button></header><div class="filter-row">${[['all','全部设备'],['online','已连接'],['remote','遥控器'],['gamepad','手柄'],['chip','自定义'],['mouse','系统鼠标']].map(([v,l])=>`<button class="filter ${state.filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}<label class="search">${icon('search')}<input id="device-search" aria-label="搜索设备" placeholder="搜索设备名称或型号" value="${esc(state.search)}"></label></div><div class="device-overview-grid" id="device-grid">${renderLibraryCards()}</div><div class="overview-bottom-hint">${icon('layers')}每台设备都有自己的配置文件；返回总览不会改变正在使用的配置。</div></main>`}
function renderLibraryCards(){const list=state.devices.filter(d=>(state.filter==='all'||state.filter==='online'&&d.online||d.type===state.filter)&&(!state.search||(d.name+' '+d.model).toLowerCase().includes(state.search.toLowerCase())));return(list.map(d=>{const p=activeProfileFor(d.id),ctx=state.deviceContexts[d.id]||{},scope=ctx.lockedScope??p.apps.find(a=>a.app===state.foreground)?.id??'base',appName=p.apps.find(a=>a.id===scope)?.name;return`<button class="device-overview-card ${d.online?'':'is-offline'}" data-device="${d.id}" aria-label="编辑${esc(d.name)}"><div class="overview-card-top"><span class="card-category">${{remote:'遥控器',gamepad:'手柄',chip:'自定义设备',mouse:'系统输入'}[d.type]}</span>${badge(d)}</div><div class="overview-card-main"><div class="overview-card-visual">${renderArt(d,true)}</div><div class="overview-card-identity"><h3>${esc(d.name)}</h3><p>${esc(d.model)}</p><small>${esc(d.serial)}</small></div></div><div class="overview-card-profile"><span>${icon('layers')}当前配置</span><strong>${esc(p.name)}${appName?' / '+esc(appName):''}</strong></div><div class="overview-card-footer"><span>${deviceProfiles(d.id).length} 份配置文件${p.apps.length?' · '+p.apps.length+' 份应用配置':''}</span><strong>编辑设备 ${icon('chevron')}</strong></div></button>`}).join('')||'<p class="empty">没有找到匹配的设备。</p>')+`<button class="device-overview-card add-device-card" data-action="add">${icon('plus')}<strong>集成新设备</strong><span>遥控器、手柄，或自己的控制器</span><small>连接 → 完成集成 → 创建设备配置</small></button>`}
function renderIntegrations(){const groups=new Map();state.devices.forEach(d=>{if(!groups.has(d.model))groups.set(d.model,[]);groups.get(d.model).push(d)});return `<main class="content library-content"><header class="heading"><div><h2>集成中心</h2><p class="subline">管理设备支持。只在首次需要或更新时完成系统准备。</p></div><div class="heading-actions"><button class="btn primary" data-action="add">${icon('plus')}添加集成</button></div></header><div class="integration-list">${[...groups].map(([model,ds])=>`<article class="integration-card"><span class="device-mini">${icon(ds[0].type)}</span><div><h3>${esc(model)} <span class="tag">${ds[0].type==='chip'?'本地描述':'内置支持'}</span></h3><p>${ds.length} 台已添加 · ${ds.filter(d=>d.integration==='ready').length} 台就绪<br>${ds[0].type==='chip'?'描述按钮与旋钮能力，每台设备独立管理自己的配置文件。':'型号支持可复用，需要单台绑定时单独完成。'}</p></div><button class="btn" data-integration-model="${esc(model)}">查看集成</button></article>`).join('')}</div><div class="discovery">${icon('chip')}<div><strong>为自己的硬件定义输入</strong><p>导入设备描述，声明按钮、摇杆、扳机或旋钮，再验证每一个输入。</p></div><button class="btn" data-action="import">导入自定义设备</button></div><p class="microcopy">系统组件、访问权限、设备连接与输入验证分别检测。只更新有需要的部分，不要求用户选择驱动名称。</p></main>`}
function openModal(title,html,kicker='设备集成'){if(overlay.hidden)returnFocus=document.activeElement;document.getElementById('modal-title').textContent=title;document.getElementById('modal-kicker').textContent=kicker;document.getElementById('modal-content').innerHTML=html;document.getElementById('close-modal').innerHTML=icon('close');overlay.hidden=false;document.getElementById('close-modal').focus()}
function closeModal(){overlay.hidden=true;render();if(returnFocus&&returnFocus.isConnected)returnFocus.focus();else document.querySelector('[data-action="all-devices"]')?.focus()}
function addDevice(){integrationCandidate=null;openModal('添加设备',`<p class="modal-desc">接入遥控器、手柄，或你自己的控制器。Axonkey 会为这台设备准备需要的支持。</p><div class="demo-indicator">原型演示：下面的发现结果为示例，不会扫描本机硬件。</div><div class="side-heading" style="padding:0;margin:0 0 10px">发现的设备</div><button class="catalog-option" data-candidate="mini"><span class="device-mini">${icon('remote')}</span><span><strong>无线遥控器 Mini <span class="tag">新型号</span></strong><small>蓝牙 · 首次需要系统集成</small></span>${icon('chevron')}</button><button class="catalog-option" data-candidate="pad"><span class="device-mini">${icon('gamepad')}</span><span><strong>USB 手柄 <span class="tag">可直接接入</span></strong><small>USB HID · 支持已就绪，仅需绑定与验证</small></span>${icon('chevron')}</button><button class="catalog-option" data-candidate="remote"><span class="device-mini">${icon('remote')}</span><span><strong>另一台 RC003</strong><small>同型号组件可复用 · 仍需完成此实例绑定</small></span>${icon('chevron')}</button><hr class="modal-divider"><button class="catalog-option" data-action="import"><span class="device-mini">${icon('chip')}</span><span><strong>自己制作的设备</strong><small>导入设备描述，声明按键、轴和旋钮</small></span>${icon('chevron')}</button><p class="microcopy">没有出现设备时，请先连接 USB 或在系统中完成蓝牙配对。</p>`)}
function chooseCandidate(kind){integrationCandidate=kind==='mini'?{name:'无线遥控器 Mini',model:'Mini Remote',type:'remote',connection:'蓝牙',requiresSystem:true,controls:[['previous','上一页','keyboard','PageUp'],['next','下一页','keyboard','PageDown'],['play','播放 / 暂停','play','播放 / 暂停']]}:kind==='pad'?{name:'USB 手柄',model:'通用 HID 手柄',type:'gamepad',connection:'USB',requiresSystem:false}:{name:'新遥控器',model:'Xiaomi RC003',type:'remote',connection:'蓝牙',requiresSystem:state.platform==='windows'};showIntegration()}
function showIntegration(){const c=integrationCandidate;const permission=c.requiresSystem;openModal('集成 '+c.name,`<p class="modal-desc">${permission?'首次接入需要为这台设备完成系统准备与实例绑定。可复用的组件无需重复添加。':'型号支持已经就绪。接下来为这台实物建立独立绑定，并验证输入。'}</p><div class="step-row"><span class="step-dot done">${icon('check')}</span><div><strong>已识别设备</strong><small>${esc(c.model)} · ${esc(c.connection)}</small></div></div><div class="step-row"><span class="step-dot ${permission?'':'done'}">${permission?'2':icon('check')}</span><div><strong>${permission?'准备设备支持':'复用已有支持'}</strong><small>${permission?(state.platform==='windows'?'Windows 可能请求管理员授权，完成后可能需要重启。':'请在系统设置中允许输入监控与辅助功能访问。'):'已有系统组件无需重复添加；如果此设备需要单独绑定，会在下一步完成。'}</small></div></div><div class="step-row"><span class="step-dot">3</span><div><strong>确认这台设备的输入</strong><small>确认设备身份，并为这台设备建立独立的配置文件。</small></div></div>${permission?`<details class="technical"><summary>查看系统变更详情</summary><p>${state.platform==='windows'?'将按需准备设备访问组件（可能包含驱动），并为当前物理实例完成首次绑定。系统授权与重启提示会由 Windows 显示。组件需通过来源与签名校验；其他设备共用的部分不会重复安装。':'需要读取设备输入与发送映射操作的系统权限。授权由系统设置完成，不安装 Windows 驱动。'}本页面为交互演示，不实际修改系统。</p></details>`:''}<div class="modal-footer"><span>只需完成此设备所需的步骤</span><button class="btn primary" data-action="start-integration">${permission?'开始集成':'继续验证'} ${icon('arrow')}</button></div>`)}
function startIntegration(){if(integrationCandidate.requiresSystem){openModal(state.platform==='windows'?'等待系统授权':'前往系统设置授权',`<div class="integration-result"><div class="result-icon amber">${icon('shield')}</div><h3>允许 Axonkey 完成设备集成</h3><p>${state.platform==='windows'?'请在 Windows 弹出的确认窗口中选择“是”。<br>授权完成后，Axonkey 会继续检查设备支持。':'请在“隐私与安全性”中允许输入监控和辅助功能。<br>回到应用后，自动继续检测。'}</p></div><div class="demo-indicator">原型不会触发真实系统授权。使用下面的演示按钮继续，或体验取消授权后的状态。</div><div class="modal-footer"><button class="btn" data-action="cancel-permission">演示：取消授权</button><button class="btn primary" data-action="permission-granted">演示：已完成授权</button></div>`)}else completeSystemStep()}
function saveCandidate(statusValue){const c=integrationCandidate;let d=c.existingId&&state.devices.find(d=>d.id===c.existingId);if(!d){d={id:uid(),name:c.name,model:c.model,type:c.type,connection:c.connection,online:true,integration:statusValue,enabled:false,requiresSystem:c.requiresSystem,serial:c.model+' · '+String(state.devices.filter(d=>d.model===c.model).length+1).padStart(2,'0'),maps:{},deadzones:{},...(c.controls?{controls:c.controls}:{})};state.devices.push(d);c.existingId=d.id}else d.integration=statusValue;ensureDeviceProfiles(d.id);return d}
function completeSystemStep(){if(state.outcome==='failure'){saveCandidate('failed');showFailure();return}if(state.outcome==='restart'&&state.platform==='windows'&&integrationCandidate.requiresSystem){saveCandidate('restart');showRestart();return}verifyInput()}
function showFailure(){openModal('集成尚未完成',`<div class="integration-result"><div class="result-icon red">${icon('alert')}</div><h3>设备支持未通过检查</h3><p>这台设备暂时不会启用映射。其他已就绪设备继续使用。<br>请重新连接设备后再试一次。</p></div><details class="technical"><summary>查看诊断详情</summary><p>演示错误：设备访问组件未就绪。实际产品应显示失败步骤、错误原因与本地日志位置。</p></details><div class="modal-footer"><button class="btn" data-action="close-refresh">稍后处理</button><button class="btn primary" data-action="retry-integration">模拟恢复后重试</button></div>`)}
function showRestart(){openModal('重启后完成集成',`<div class="integration-result"><div class="result-icon amber">${icon('refresh')}</div><h3>设备支持已准备好</h3><p>请保存手头工作，在合适的时候重启系统。<br>再次打开 Axonkey，会继续验证这台设备的输入。</p></div><div class="demo-indicator">重启前保留“待完成”状态，不会提前标记为可用。原型不会重启电脑。</div><div class="modal-footer"><button class="btn" data-action="close-refresh">稍后重启</button><button class="btn primary" data-action="after-restart">演示：已重启并返回</button></div>`)}
function verifyInput(){saveCandidate('verifying');openModal('确认设备输入',`<div class="integration-result"><div class="result-icon">${icon(integrationCandidate.type)}</div><h3>操作一下这台设备的输入</h3><p>按下按键、转动旋钮或移动摇杆。<br>确认输入来自 ${esc(integrationCandidate.name)}，<br>避免把另一台同型号设备认错。</p></div><div class="step-row"><span class="step-dot done">${icon('check')}</span><div><strong>设备支持与连接已就绪</strong><small>等待设备专属输入，完成绑定。</small></div></div><div class="modal-footer"><span>演示中使用按钮模拟一次硬件输入</span><button class="btn primary" data-action="verified-input">模拟收到设备输入</button></div>`)}
function integrationSuccess(){const d=saveCandidate('ready');d.enabled=true;selectDevice(d.id);openModal('设备已就绪',`<div class="integration-result"><div class="result-icon">${icon('check')}</div><h3>${esc(d.name)} 已加入 Axonkey</h3><p>设备集成与输入验证已完成。<br>已为这台设备创建独立配置，现在可以编辑触发泳道。</p></div><label class="input-label">给这台设备起个名字<input id="new-device-name" maxlength="32" value="${esc(d.name)}"></label><div class="modal-footer"><span>配置保存在本机，重新连接后恢复。</span><button class="btn primary" data-action="finish-integration">开始配置 ${icon('arrow')}</button></div>`)}
function importDevice(){integrationCandidate=null;openModal('接入自己的设备',`<p class="modal-desc">让固件告诉 Axonkey：“我有什么输入”。导入描述后，用统一编辑器配置按键、旋钮和轴。</p><label class="file-label">${icon('file')} 导入设备描述 JSON<input id="descriptor-file" type="file" accept="application/json,.json"></label><p class="error" id="descriptor-error" role="alert"></p><div class="modal-footer"><span>还没有描述文件？先体验一份示例。</span><button class="btn" data-action="load-descriptor">使用旋钮控制器示例</button></div><details class="technical"><summary>查看本原型接受的示例格式</summary><p><code>{ "name": "我的设备", "model": "DIY-01", "controls": [{ "id": "k1", "label": "按键 1", "type": "button" }] }</code></p><p>支持 button、axis、encoder；名称与型号不超过 40 字，输入 ID 唯一，最多 32 个输入。仅展示能力描述，不是已确定的协议。正式接入还需要稳定设备标识、传输协议与匹配规则。</p></details><p class="microcopy">这里不会上传固件，也不会烧录设备。设备应先运行能被系统识别的固件。</p>`,'自定义设备')}

function validAction(a){if(!a||typeof a!=='object'||!['key','paste','delay','openApp','openWebsite','media','mouse','continuous','switchProfile'].includes(a.type))return false;if(a.type==='delay')return typeof a.value==='number'&&Number.isFinite(a.value)&&a.value>=0&&a.value<=300000;if(a.type==='switchProfile')return ['next','previous'].includes(a.direction);return typeof a.value==='string'&&a.value.length<=20000}
function validateProfileData(data){if(data?.format!=='axonkey.device-profile-prototype.v3')throw Error('请使用本原型导出的配置文件。');if(data.device?.model!==selectedDevice().model||data.device?.type!==selectedDevice().type)throw Error('请选择当前设备同型号的配置文件。');const p=data.profile;if(!p||typeof p.name!=='string'||!p.name.trim()||p.name.length>40||!p.base||typeof p.base!=='object'||Array.isArray(p.base)||!Array.isArray(p.apps)||p.apps.length>20)throw Error('配置文件内容不完整。');const maps=[p.base];const matches=new Set();for(const a of p.apps){if(!a||typeof a.id!=='string'||!/^[-\w]{1,60}$/.test(a.id)||typeof a.name!=='string'||a.name.length>40||!appDefinitions[a.app]||a.app==='desktop'||matches.has(a.app)||!a.overrides||typeof a.overrides!=='object'||Array.isArray(a.overrides))throw Error('应用配置的匹配规则无效或重复。');matches.add(a.app);maps.push(a.overrides)}for(const map of maps){if(Object.keys(map).length>1000)throw Error('泳道数量过多。');for(const[key,lane]of Object.entries(map)){if(!/^[-\w]+(?:\/[-\w]+){2,3}$/.test(key)||!lane||!['original','custom','disabled'].includes(lane.mode)||!Array.isArray(lane.actions)||lane.actions.length>100||!lane.actions.every(validAction))throw Error('存在无法识别的泳道或动作。');if(lane.actions.some(a=>a.type==='switchProfile'))throw Error('含设备配置切换动作的文件需确认此设备内的覆盖范围；本原型请先移除该动作再导出。')}}const result=structuredClone(p);if(typeof p.deviceId!=='string'||p.deviceId!==data.device.id)throw Error('设备归属信息无效。');const remap=map=>Object.fromEntries(Object.entries(map).map(([key,lane])=>{if(!key.startsWith(p.deviceId+'/'))throw Error('配置包含其他设备的泳道。');return[state.deviceId+key.slice(p.deviceId.length),lane]}));result.base=remap(result.base);result.apps.forEach(a=>a.overrides=remap(a.overrides));result.deviceId=state.deviceId;return result}

function ensureWritable(trigger){const r=resolvedLane(trigger);if(r.shared){toast('设备配置切换泳道不能追加其他动作。');return false}if(r.inherited){toast('先点击“覆盖此泳道”，再为这个应用编辑。');return false}if(r.lane.mode==='disabled'){toast('请先清空泳道以取消禁用。');return false}return true}
function openActionEditor(type,trigger=state.trigger,index=null,provided=null,insertAt=null){if(!ensureWritable(trigger))return;state.trigger=trigger;const value=provided|| (index===null?defaultAction(type):resolvedLane(trigger).lane.actions[index]);actionDraft={trigger,index,insertAt,action:structuredClone(value)};const a=actionDraft.action;let form='';if(a.type==='paste')form=`<label class="input-label">文本内容<textarea id="action-value">${esc(a.value)}</textarea></label>`;else if(a.type==='delay')form=`<label class="input-label">等待时间（毫秒）<input id="action-value" type="number" min="0" max="300000" step="1" value="${a.value}"></label>`;else if(['media','mouse','continuous'].includes(a.type)){const opts=a.type==='media'?['播放 / 暂停','上一曲','下一曲','增大音量','减小音量','静音']:a.type==='continuous'?['增大音量','减小音量','水平滚动','垂直滚动']:['向上滚动','向下滚动','左键单击','右键单击','向右移动 80 px'];if(!opts.includes(a.value))opts.unshift(a.value);form=`<label class="input-label">操作<select id="action-value">${opts.map(v=>`<option ${v===a.value?'selected':''}>${v}</option>`).join('')}</select></label>`}else form=`<label class="input-label">${a.type==='key'?'按键 / 组合键':a.type==='openApp'?'应用名称或路径':'网站地址'}<input id="action-value" value="${esc(a.value)}" maxlength="1000" placeholder="${a.type==='key'?'例如 Ctrl+Shift+P':''}"></label>`;openModal(index===null?'添加'+({key:'按键',paste:'文本',delay:'等待',openApp:'打开应用',openWebsite:'打开网站',media:'媒体控制',mouse:'鼠标操作',continuous:'连续输入行为'}[a.type]||'动作'):'编辑动作',`<p class="modal-desc">${esc(selectedProfile().name)} / ${esc(scopeName(state.editScope))} / ${esc(selectedDevice().name)} / ${esc(selectedControl()[1])} · ${triggers(selectedControl()).find(t=>t[0]===trigger)?.[1]}</p>${form}<label class="inline-checkbox"><input id="action-enabled" type="checkbox" ${a.enabled!==false?'checked':''}>启用这个动作</label><p class="error" id="action-error" role="alert"></p><div class="modal-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-action">${index===null?'添加到序列':'保存修改'}</button></div>`,'泳道动作')}
function saveAction(){const draft=actionDraft,a=draft.action,raw=document.getElementById('action-value').value;let val=a.type==='paste'?raw:raw.trim();if(a.type==='delay'){val=Number(val);if(!Number.isInteger(val)||val<0||val>300000){document.getElementById('action-error').textContent='请输入 0–300000 之间的整数毫秒数。';return}}else if(a.type!=='paste'&&!val){document.getElementById('action-error').textContent='请输入有效内容。';return}if(a.type==='openWebsite'){try{const u=new URL(val);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{document.getElementById('action-error').textContent='请使用完整的 http 或 https 地址。';return}}a.value=val;a.enabled=document.getElementById('action-enabled').checked;mutateLane(draft.trigger,l=>{l.mode='custom';if(draft.index===null)l.actions.splice(draft.insertAt===null?l.actions.length:draft.insertAt,0,a);else l.actions[draft.index]=a});closeModal();toast('已保存当前泳道')}

function saveLane(trigger){const r=resolvedLane(trigger);openModal('另存为已保存序列',`<p class="modal-desc">将这条泳道的 ${r.lane.actions.length} 个动作保存到右侧行为库，其他设备和配置文件都可以插入副本。</p><label class="input-label">序列名称<input id="sequence-name" maxlength="40" value="${esc(selectedControl()[1]+' · '+triggers(selectedControl()).find(t=>t[0]===trigger)[1])}"></label><p class="error" id="sequence-error" role="alert"></p><div class="modal-footer"><span>另存序列不会新增配置文件</span><button class="btn primary" data-save-lane="${trigger}">保存到行为库</button></div>`,'已保存序列')}
function pasteLane(trigger,actions=state.clipboard?.actions,insertAt=null){if(!actions)return;if(!compatibleActions(actions))return;const sw=actions.find(a=>a.type==='switchProfile');if(sw){showSharedSwitch(trigger,sw);return}if(!ensureWritable(trigger))return;if(insertAt!==null){mutateLane(trigger,l=>{l.mode='custom';l.actions.splice(insertAt,0,...actions.map(a=>({...structuredClone(a),id:uid()})))});toast('已在拖放位置插入序列副本');return}pasteTarget={trigger,actions:structuredClone(actions)};openModal('粘贴动作序列',`<p class="modal-desc">${actions.length} 个动作将复制到当前${triggers(selectedControl()).find(t=>t[0]===trigger)[1]}泳道。后续修改相互独立。</p><div class="modal-footer"><button class="btn" data-paste-mode="replace">替换整条泳道</button><button class="btn primary" data-paste-mode="append">追加到末尾</button></div>`,'泳道动作')}
function showSharedSwitch(trigger,copied=null){pendingSwitchTrigger=trigger;const r=resolvedLane(trigger);pendingSwitchKey=!copied&&r.shared?r.sourceKey:laneKey(trigger);const current=copied||state.sharedSwitches[pendingSwitchKey];openModal('切换配置文件 · 覆盖确认',`<div class="confirm-scope">将覆盖此设备的所有配置文件中“${esc(selectedDevice().name)} / ${esc(selectedControl()[1])} / ${triggers(selectedControl()).find(t=>t[0]===trigger)?.[1]}”的现有序列，该位置仅保留“切换配置文件”。${pendingSwitchKey.split('/').length===4?'鼠标区域：'+({global:'任意位置',top:'上边缘',left:'左边缘',right:'右边缘'}[pendingSwitchKey.split('/')[1]])+'。':''}应用配置不能另行覆盖这个入口。</div><div class="confirm-list">${deviceProfiles().map(p=>`<div><strong>${esc(p.name)}</strong> · ${p.apps.length} 份应用配置也继承此切换入口</div>`).join('')}</div><label class="input-label">切换方向<select id="switch-direction"><option value="next" ${current?.direction==='next'?'selected':''}>下一份配置文件</option><option value="previous" ${current?.direction==='previous'?'selected':''}>上一份配置文件</option></select></label><label class="inline-checkbox"><input type="checkbox" id="switch-loop" ${current?.loop!==false?'checked':''}>到边缘后循环</label><p class="microcopy">通过硬件切换后锁定目标通用配置，避免被应用自动匹配立即切回；可从状态栏恢复自动。</p><div class="modal-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="confirm-shared-switch">确认覆盖并放入</button></div>`,'延续现有跨配置切换语义')}
function confirmSharedSwitch(){remember();const key=pendingSwitchKey,a=action('switchProfile','切换配置文件',{direction:document.getElementById('switch-direction').value,loop:document.getElementById('switch-loop').checked});state.sharedSwitches[key]=a;deviceProfiles().forEach(p=>{p.base[key]=custom([structuredClone(a)]);p.apps.forEach(ap=>delete ap.overrides[key])});state.trigger=pendingSwitchTrigger;closeModal();toast('已更新此设备所有配置中的切换入口')}
function removeSharedSwitch(trigger){pendingSwitchTrigger=trigger;pendingSwitchKey=resolvedLane(trigger).sourceKey;openModal('从此设备的所有配置中移除切换入口',`<p class="modal-desc">当前显示的来源泳道在此设备的所有配置文件中共用。移除后，各配置的该位置恢复为空，不再触发配置切换。</p><div class="modal-footer"><button class="btn" data-action="close">取消</button><button class="btn danger" data-action="confirm-remove-switch">确认移除</button></div>`,'设备配置切换')}
function simulateInput(){const d=selectedDevice();if(!state.masterEnabled||!d.enabled||!d.online||d.integration!=='ready'){toast('当前输入源未处于可用状态，仅可编辑配置。');return}const key=laneKey(),runtime=resolveForScope(key,effectiveScope()),sw=runtime.shared?runtime.lane.actions[0]:null;if(sw){const profiles=deviceProfiles(),i=profiles.findIndex(p=>p.id===state.profileId),dir=sw.direction==='previous'?-1:1;let ni=i+dir;if(ni<0||ni>=profiles.length){if(!sw.loop){toast('已到配置列表边缘');return}ni=(ni+profiles.length)%profiles.length}switchProfile(profiles[ni].id);state.lockedScope='base';render();toast('模拟硬件切换：'+selectedProfile().name+' · 已锁定');return}const scope=effectiveScope();const lane=runtime.lane;toast('模拟运行「'+scopeName(scope)+'」：'+(lane.mode==='disabled'?'此触发已禁用':lane.actions.filter(a=>a.enabled!==false).map(describeAction).join(' → ')||'保留原输入 / 未设置'))}

function dropPayload(payload,trigger,index){
 if(!payload||!ensureWritable(trigger))return;state.trigger=trigger;
 if(payload.kind==='tool'){addTool(payload.id,trigger,index);return}
 if(payload.kind==='saved'){const s=state.savedSequences.find(s=>s.id===payload.id);if(s)pasteLane(trigger,s.actions,index===null?resolvedLane(trigger).lane.actions.length:index);return}
 if(payload.kind==='continuous'){mutateLane(trigger,l=>{l.mode='custom';l.actions=[action('continuous',payload.value)]});return}
 if(payload.kind!=='node')return;const src=resolvedLane(payload.trigger);if(src.inherited||src.shared||!src.lane.actions[payload.index])return;
 const sourceKey=laneKey(payload.trigger),targetKey=laneKey(trigger);let at=index===null?resolvedLane(trigger).lane.actions.length:index;
 remember();const map=scopeMap();map[sourceKey]=structuredClone(src.lane);if(targetKey!==sourceKey)map[targetKey]=structuredClone(resolvedLane(trigger).lane);
 const [node]=map[sourceKey].actions.splice(payload.index,1);const target=map[targetKey];target.mode='custom';if(targetKey===sourceKey&&payload.index<at)at--;target.actions.splice(Math.max(0,Math.min(at,target.actions.length)),0,node);render();toast('已移动动作');
}

document.addEventListener('dragleave',e=>{const target=e.target.closest('[data-lane],[data-trash]');if(target&&!target.contains(e.relatedTarget))target.classList.remove('drag-over')});
document.addEventListener('dragend',()=>{document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));dragData=null});
document.addEventListener('drop',e=>{const target=e.target.closest('[data-lane],[data-trash]');if(!target)return;e.preventDefault();document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));const payload=dragData;dragData=null;if(!payload)return;if(target.hasAttribute('data-trash')){if(payload.kind==='node')mutateLane(payload.trigger,l=>{l.mode='custom';l.actions.splice(payload.index,1)});return}const node=e.target.closest('[data-node-index]');dropPayload(payload,target.dataset.lane,node?Number(node.dataset.nodeIndex):null)});
document.getElementById('reset-demo').addEventListener('click',()=>{const design=state.design;state.devices=initialDevices();state.profiles=initialProfiles();state.profileId='remote1-default';state.deviceContexts={};state.overviewScroll=0;state.editScope='base';state.deviceId='remote1';state.control='voice';state.trigger='click';state.mouseScope='global';state.foreground='desktop';state.lockedScope=null;state.masterEnabled=true;state.sharedSwitches={};state.clipboard=null;state.savedSequences=[{id:'sample-sequence',name:'输入文本并回车',actions:[action('paste','请继续完成剩余步骤'),action('delay',30),action('key','Enter')]}];state.category='all';state.toolSearch='';state.history=[];state.future=[];state.filter='all';state.search='';state.outcome='success';state.view='library';state.design=design;document.getElementById('foreground').value='desktop';document.getElementById('outcome').value='success';closeModal();render();toast('已恢复初始示例配置')});
render();
</script>
</body>
</html>
