<svg xmlns="http://www.w3.org/2000/svg" id="mouse-c" class="mouse-diagram" viewBox="0 0 240 390" width="240" height="390" role="group" aria-labelledby="title-c"><title id="title-c">外侧标注鼠标输入示意图</title><desc>左键、右键、滚轮按下、前进、后退与四个滚动方向。蓝色表示当前选择。</desc><style>
svg { --ink:#506e8a; --line:#aebdca; --blue:#287fd9; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
.part { cursor:pointer; outline:none; }
.part .zone { fill:var(--surface,#f6f9fc); stroke:var(--line); stroke-width:1.35; transition:fill .14s,stroke .14s; }
.part .label { fill:var(--ink); font-size:14px; font-weight:550; text-anchor:middle; pointer-events:none; user-select:none; }
.part .glyph { fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
.part .hint { fill:#6e859a; font-size:11px; text-anchor:middle; pointer-events:none; }
.part .wire { fill:none; stroke:#99adbf; stroke-width:1.2; pointer-events:none; }
.part .rib { stroke:#889baa; stroke-width:1.6; stroke-linecap:round; pointer-events:none; }
.part:hover .zone { fill:#e7f2ff; stroke:#75a9dd; }
.part.is-selected .zone { fill:var(--blue); stroke:#1c6fc2; }
.part.is-selected .label { fill:#fff; }
.part.is-selected .glyph,.part.is-selected .rib { stroke:#e8f4ff; }
.part.is-selected .hint { fill:#2472bd; font-weight:600; }
.part.is-selected .wire { stroke:#287fd9; }
.part:focus-visible .zone { stroke:#11599d; stroke-width:2.7; }
.part:active .zone { fill:#cce4ff; }
.part.is-selected:active .zone { fill:#166cc2; }
.diagram-note { fill:#8496a7; font-size:12px; text-anchor:middle; pointer-events:none; }
svg.is-disabled { opacity:.48; }
svg.is-disabled .part { cursor:default; pointer-events:none; }
svg.hide-labels .part .label,svg.hide-labels .part .hint { opacity:0; }
@media (prefers-reduced-motion:reduce) { .part .zone { transition:none; } }
</style><defs>
<linearGradient id="shell-c" x1="65" y1="30" x2="179" y2="253" gradientUnits="userSpaceOnUse"><stop stop-color="#fbfcfd"/><stop offset=".48" stop-color="#e2e8ed"/><stop offset="1" stop-color="#b9c5cf"/></linearGradient>
<linearGradient id="button-c" x1="80" y1="25" x2="160" y2="128" gradientUnits="userSpaceOnUse"><stop stop-color="#fafcfe"/><stop offset="1" stop-color="#e3eaf0"/></linearGradient>
<linearGradient id="side-c" x1="55" y1="100" x2="170" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#bbc7d2"/><stop offset="1" stop-color="#8f9fac"/></linearGradient>
<filter id="shadow-c" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2.8" flood-color="#61778c" flood-opacity=".13"/></filter>
</defs><path d="M120 49C91 49 74 72 74 111v83c0 42 17 66 46 66s46-24 46-66v-83c0-39-17-62-46-62Z" fill="url(#shell-c)" stroke="#9eafbe" stroke-width="1.5" filter="url(#shadow-c)"/><path d="M79 132c24 6 58 6 82 0M120 139v108" fill="none" stroke="#c2cdd6" stroke-width="1.2"/><g class="part" data-part="buttonLeft" role="button" tabindex="0" aria-label="鼠标左键" aria-pressed="false" style="--surface:url(#button-c)"><title>鼠标左键</title><path class="zone" d="M113 55C91 59 80 79 80 112v14c10 3 22 4 33 4V55Z"/><path class="wire" d="M93 93H66L51 74"/><rect class="zone" x="4" y="43" width="57" height="29" rx="6"/><text class="label" x="32.5" y="62" style="font-size:14px">左键</text></g><g class="part" data-part="buttonRight" role="button" tabindex="0" aria-label="鼠标右键" aria-pressed="false" style="--surface:url(#button-c)"><title>鼠标右键</title><path class="zone" d="M127 55c22 4 33 24 33 57v14c-10 3-22 4-33 4V55Z"/><path class="wire" d="M148 94h30l15-20"/><rect class="zone" x="179" y="43" width="57" height="29" rx="6"/><text class="label" x="207.5" y="62" style="font-size:14px">右键</text></g><g class="part" data-part="buttonForward" role="button" tabindex="0" aria-label="鼠标前进键" aria-pressed="false" style="--surface:url(#button-c)"><title>鼠标前进键</title><rect class="zone" x="65" y="142" width="15" height="35" rx="5"/><path class="wire" d="M65 158H56"/><rect class="zone" x="2" y="144" width="53" height="29" rx="6"/><text class="label" x="28.5" y="163" style="font-size:13px">前进</text></g><g class="part" data-part="buttonBack" role="button" tabindex="0" aria-label="鼠标后退键" aria-pressed="false" style="--surface:url(#button-c)"><title>鼠标后退键</title><rect class="zone" x="65" y="187" width="15" height="35" rx="5"/><path class="wire" d="M65 204H56"/><rect class="zone" x="2" y="190" width="53" height="29" rx="6"/><text class="label" x="28.5" y="209" style="font-size:13px">后退</text></g><g class="part is-selected" data-part="buttonMiddle" role="button" tabindex="0" aria-label="滚轮按下（中键）" aria-pressed="true" style="--surface:url(#button-c)"><title>滚轮按下（中键）</title><rect class="zone" x="113" y="73" width="14" height="44" rx="6"/><path class="rib" d="M117 82h6"/><path class="rib" d="M117 89h6"/><path class="rib" d="M117 96h6"/><path class="rib" d="M117 103h6"/><path class="wire" d="M127 102h46l12 12"/><rect class="zone" x="173" y="117" width="64" height="29" rx="6"/><text class="label" x="205" y="136" style="font-size:12px">滚轮按下</text></g><text class="diagram-note" x="120" y="286">滚动方向</text><g class="part" data-part="up" role="button" tabindex="0" aria-label="向上滚动" aria-pressed="false"><title>向上滚动</title><rect class="zone" x="15" y="300" width="45" height="57" rx="8"/><path class="glyph" d="M0 7V-7M-5-2l5-5 5 5" transform="translate(37.5 316)"/><text class="label" x="37.5" y="344" style="font-size:12px">上滚</text></g><g class="part" data-part="down" role="button" tabindex="0" aria-label="向下滚动" aria-pressed="false"><title>向下滚动</title><rect class="zone" x="70" y="300" width="45" height="57" rx="8"/><path class="glyph" d="M0-7V7M-5 2l5 5 5-5" transform="translate(92.5 316)"/><text class="label" x="92.5" y="344" style="font-size:12px">下滚</text></g><g class="part" data-part="left" role="button" tabindex="0" aria-label="向左滚动" aria-pressed="false"><title>向左滚动</title><rect class="zone" x="125" y="300" width="45" height="57" rx="8"/><path class="glyph" d="M7 0H-7M-2-5l-5 5 5 5" transform="translate(147.5 316)"/><text class="label" x="147.5" y="344" style="font-size:12px">左滚</text></g><g class="part" data-part="right" role="button" tabindex="0" aria-label="向右滚动" aria-pressed="false"><title>向右滚动</title><rect class="zone" x="180" y="300" width="45" height="57" rx="8"/><path class="glyph" d="M-7 0H7M2-5l5 5-5 5" transform="translate(202.5 316)"/><text class="label" x="202.5" y="344" style="font-size:12px">右滚</text></g></svg>