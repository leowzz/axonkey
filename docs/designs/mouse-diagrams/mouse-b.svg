<svg xmlns="http://www.w3.org/2000/svg" id="mouse-b" class="mouse-diagram" viewBox="0 0 240 390" width="240" height="390" role="group" aria-labelledby="title-b"><title id="title-b">轻立体鼠标输入示意图</title><desc>左键、右键、滚轮按下、前进、后退与四个滚动方向。蓝色表示当前选择。</desc><style>
svg { --ink:#506e8a; --line:#aebdca; --blue:#287fd9; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
.part { cursor:pointer; outline:none; }
.part .zone { fill:var(--surface,#f6f9fc); stroke:var(--line); stroke-width:1.35; transition:fill .14s,stroke .14s; }
.part .label { fill:var(--ink); font-size:14px; font-weight:550; text-anchor:middle; pointer-events:none; user-select:none; }
.part .glyph { fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
.part .hint { fill:#6e859a; font-size:11px; text-anchor:middle; pointer-events:none; }
.part .wire { fill:none; stroke:#99adbf; stroke-width:1.2; pointer-events:none; }
.part .rib { stroke:#889baa; stroke-width:1.6; stroke-linecap:round; pointer-events:none; }
.part:hover .zone { fill:#e7f2ff; stroke:#75a9dd; }
.part.is-selected .zone { fill:var(--blue); stroke:#1c6fc2; }
.part.is-selected .label { fill:#fff; }
.part.is-selected .glyph,.part.is-selected .rib { stroke:#e8f4ff; }
.part.is-selected .hint { fill:#2472bd; font-weight:600; }
.part.is-selected .wire { stroke:#287fd9; }
.part:focus-visible .zone { stroke:#11599d; stroke-width:2.7; }
.part:active .zone { fill:#cce4ff; }
.part.is-selected:active .zone { fill:#166cc2; }
.diagram-note { fill:#8496a7; font-size:12px; text-anchor:middle; pointer-events:none; }
svg.is-disabled { opacity:.48; }
svg.is-disabled .part { cursor:default; pointer-events:none; }
svg.hide-labels .part .label,svg.hide-labels .part .hint { opacity:0; }
@media (prefers-reduced-motion:reduce) { .part .zone { transition:none; } }
</style><defs>
<linearGradient id="shell-b" x1="65" y1="30" x2="179" y2="253" gradientUnits="userSpaceOnUse"><stop stop-color="#fbfcfd"/><stop offset=".48" stop-color="#e2e8ed"/><stop offset="1" stop-color="#b9c5cf"/></linearGradient>
<linearGradient id="button-b" x1="80" y1="25" x2="160" y2="128" gradientUnits="userSpaceOnUse"><stop stop-color="#fafcfe"/><stop offset="1" stop-color="#e3eaf0"/></linearGradient>
<linearGradient id="side-b" x1="55" y1="100" x2="170" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#bbc7d2"/><stop offset="1" stop-color="#8f9fac"/></linearGradient>
<filter id="shadow-b" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2.8" flood-color="#61778c" flood-opacity=".13"/></filter>
</defs><g transform="rotate(-12 124 142)"><path d="M124 20C81 20 57 51 57 102v78c0 50 23 80 67 80s67-30 67-80v-78c0-51-24-82-67-82Z" transform="translate(5 8)" fill="url(#side-b)" stroke="#9cabb8" stroke-width="1.5"/><path d="M124 20C81 20 57 51 57 102v78c0 50 23 80 67 80s67-30 67-80v-78c0-51-24-82-67-82Z" fill="url(#shell-b)" stroke="#9eafbe" stroke-width="1.6" filter="url(#shadow-b)"/><path d="M66 128c37 9 79 9 117 0M124 136v112" fill="none" stroke="#c2cdd6" stroke-width="1.1"/><path d="M73 59c8-16 18-24 33-28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g><g class="part" data-part="buttonLeft" role="button" tabindex="0" aria-label="鼠标左键" aria-pressed="false" style="--surface:url(#button-b)"><title>鼠标左键</title><g transform="rotate(-12 124 142)"><path class="zone" d="M116 27C82 30 64 57 64 100v19c16 5 34 7 52 7V27Z"/><text class="label" x="88" y="103" style="font-size:13px">左键</text></g></g><g class="part" data-part="buttonRight" role="button" tabindex="0" aria-label="鼠标右键" aria-pressed="false" style="--surface:url(#button-b)"><title>鼠标右键</title><g transform="rotate(-12 124 142)"><path class="zone" d="M132 27c34 3 52 30 52 73v19c-16 5-34 7-52 7V27Z"/><text class="label" x="160" y="103" style="font-size:13px">右键</text></g></g><g class="part" data-part="buttonForward" role="button" tabindex="0" aria-label="鼠标前进键" aria-pressed="false" style="--surface:url(#button-b)"><title>鼠标前进键</title><g transform="rotate(-12 124 142)"><rect class="zone" x="42" y="129" width="22" height="44" rx="7"/><text class="label" x="53" y="146" style="font-size:11px">前</text><text class="label" x="53" y="161" style="font-size:11px">进</text></g></g><g class="part" data-part="buttonBack" role="button" tabindex="0" aria-label="鼠标后退键" aria-pressed="false" style="--surface:url(#button-b)"><title>鼠标后退键</title><g transform="rotate(-12 124 142)"><rect class="zone" x="42" y="182" width="22" height="44" rx="7"/><text class="label" x="53" y="199" style="font-size:11px">后</text><text class="label" x="53" y="214" style="font-size:11px">退</text></g></g><g class="part is-selected" data-part="buttonMiddle" role="button" tabindex="0" aria-label="滚轮按下（中键）" aria-pressed="true" style="--surface:url(#button-b)"><title>滚轮按下（中键）</title><g transform="rotate(-12 124 142)"><rect class="zone" x="113" y="51" width="22" height="51" rx="9"/><path class="rib" d="M119 61h10"/><path class="rib" d="M119 68h10"/><path class="rib" d="M119 75h10"/><path class="rib" d="M119 82h10"/><path class="rib" d="M119 89h10"/><text class="hint" x="124" y="119">按下</text></g></g><text class="diagram-note" x="120" y="286">滚动方向</text><g class="part" data-part="up" role="button" tabindex="0" aria-label="向上滚动" aria-pressed="false"><title>向上滚动</title><rect class="zone" x="15" y="300" width="45" height="57" rx="8"/><path class="glyph" d="M0 7V-7M-5-2l5-5 5 5" transform="translate(37.5 316)"/><text class="label" x="37.5" y="344" style="font-size:12px">上滚</text></g><g class="part" data-part="down" role="button" tabindex="0" aria-label="向下滚动" aria-pressed="false"><title>向下滚动</title><rect class="zone" x="70" y="300" width="45" height="57" rx="8"/><path class="glyph" d="M0-7V7M-5 2l5 5 5-5" transform="translate(92.5 316)"/><text class="label" x="92.5" y="344" style="font-size:12px">下滚</text></g><g class="part" data-part="left" role="button" tabindex="0" aria-label="向左滚动" aria-pressed="false"><title>向左滚动</title><rect class="zone" x="125" y="300" width="45" height="57" rx="8"/><path class="glyph" d="M7 0H-7M-2-5l-5 5 5 5" transform="translate(147.5 316)"/><text class="label" x="147.5" y="344" style="font-size:12px">左滚</text></g><g class="part" data-part="right" role="button" tabindex="0" aria-label="向右滚动" aria-pressed="false"><title>向右滚动</title><rect class="zone" x="180" y="300" width="45" height="57" rx="8"/><path class="glyph" d="M-7 0H7M2-5l5 5-5 5" transform="translate(202.5 316)"/><text class="label" x="202.5" y="344" style="font-size:12px">右滚</text></g></svg>