<body>
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>

    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h.01M10 9h.01M14 9h.01M17 9h.01M7 12h.01M10 12h.01M14 12h.01M17 12h.01M7 15h10"/></symbol>
    <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 9H6a3 3 0 1 1 3-3v12a3 3 0 1 1-3-3h12a3 3 0 1 1-3 3V6a3 3 0 1 1 3 3H9Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-bluetooth" viewBox="0 0 24 24"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></symbol>
    <symbol id="i-mouse" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="7"/><path d="M12 2v7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </defs></svg>
  <div class="app">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><img src="../../src-tauri/icons/128x128@2x.png" alt=""><span>axonkey</span></div>
      <nav class="nav">
        <button type="button" aria-current="page"><svg class="icon"><use href="#i-home"/></svg>首页</button>
        <button type="button" data-open="settings"><svg class="icon"><use href="#i-settings"/></svg>设置</button>
        <button type="button" data-open="about"><svg class="icon"><use href="#i-info"/></svg>关于</button>
      </nav>
      <div class="sidebar-bottom">
        <span class="prototype-label">方案 B<br>设备与权限分栏</span>
        <div class="software-control"><span>软件总开关</span><button id="software-switch" class="switch" type="button" role="switch" aria-checked="true" aria-label="软件总开关示例"></button></div>
      </div>
    </aside>
    <main class="workspace">
      <div class="page">
        <header class="page-heading">
          <div><h1>设备与权限</h1><p>集中管理设备映射与系统权限。</p></div>
          <button type="button" class="outline-button" data-open="integrate"><svg class="icon"><use href="#i-plus"/></svg>集成设备</button>
        </header>
        <div class="columns">
          <section class="devices" aria-labelledby="devices-title">
            <div class="section-heading"><h2 id="devices-title">我的设备</h2><span class="device-count">2</span></div>
            <div class="device-list">
              <button type="button" class="device-card" data-device="rc003" aria-label="编辑小米遥控器的映射">
                <span class="device-art" aria-hidden="true"><img class="remote-art" src="../../public/rc003-remote-keymap.svg" alt=""></span>
                <span class="device-copy">
                  <span class="device-title-row"><strong class="device-name">小米遥控器</strong><span class="device-badge">连接未检测</span></span>
                  <span class="device-model">RC003 · 蓝牙遥控器</span>
                  <span class="device-description">配置按键的单击、双击与长按行为。</span>
                  <span class="device-profile"><span><svg class="icon"><use href="#i-layers"/></svg>当前配置</span><strong>默认配置</strong></span>
                  <span class="device-card-footer"><span>配置示例</span><strong class="edit-label">编辑映射<svg class="icon"><use href="#i-chevron"/></svg></strong></span>
                </span>
              </button>
              <button type="button" class="device-card" data-device="mouse" aria-label="编辑系统鼠标的映射">
                <span class="device-art" aria-hidden="true"><svg class="mouse-art" viewBox="0 0 100 132" fill="none"><path d="M50 8C28 8 14 23 14 46v39c0 24 13 39 36 39s36-15 36-39V46C86 23 72 8 50 8Z" fill="#e9edf1" stroke="#a3afbd" stroke-width="1.6"/><path d="M50 9v45M15 54h70" stroke="#b2bdca" stroke-width="1.4"/><rect x="45" y="26" width="10" height="20" rx="5" fill="#8d9db0"/><path d="M21 62v12m0 7v12" stroke="#899bb0" stroke-width="3" stroke-linecap="round"/></svg></span>
                <span class="device-copy">
                  <span class="device-title-row"><strong class="device-name">系统鼠标</strong><span class="device-badge">系统输入</span></span>
                  <span class="device-model">全部鼠标共用输入</span>
                  <span class="device-description">统一配置鼠标按键、滚轮与屏幕区域。</span>
                  <span class="device-profile"><span><svg class="icon"><use href="#i-layers"/></svg>当前配置</span><strong>默认配置</strong></span>
                  <span class="device-card-footer"><span>配置示例</span><strong class="edit-label">编辑映射<svg class="icon"><use href="#i-chevron"/></svg></strong></span>
                </span>
              </button>
            </div>
            <p class="devices-note"><svg class="icon"><use href="#i-layers"/></svg><span>每类设备保留自己的配置，进入后继续使用现有映射编辑器。</span></p>
          </section>
          <aside class="permissions" aria-labelledby="permissions-title">
            <div class="permissions-heading"><h2 id="permissions-title">系统权限</h2><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg></div>
            <p class="permissions-intro">用于读取输入并执行映射。</p>
            <div class="permission-list">
              <div class="permission-item"><span class="permission-icon"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg></span><div><div class="permission-title"><h3>输入监控</h3><span class="permission-status" data-status="inputMonitoring">已授权</span></div><p>允许读取设备输入。</p></div></div>
              <div class="permission-item"><span class="permission-icon"><svg class="icon" aria-hidden="true"><use href="#i-command"/></svg></span><div><div class="permission-title"><h3>辅助功能</h3><span class="permission-status" data-status="accessibility">已授权</span></div><p>允许发送按键与文本。</p></div></div>
            </div>
            <button type="button" class="permissions-manage" data-open="permissions"><span>管理系统权限</span><svg class="icon"><use href="#i-chevron"/></svg></button>
            <p class="permissions-note">权限状态为演示示例。浏览器无法检测或修改系统授权。</p>
          </aside>
        </div>
        <footer class="page-footer"><span><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>静态交互示例 · 不连接设备</span><span id="software-note" class="demo-state" role="status"></span><span>Axonkey · 方案 B</span></footer>
      </div>
    </main>
  </div>
  <dialog id="demo-dialog" aria-labelledby="dialog-title"><div class="dialog-content"><header class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="dialog-close" data-close aria-label="关闭弹窗"><svg class="icon"><use href="#i-close"/></svg></button></header><div id="dialog-body" class="dialog-body"></div><footer class="dialog-footer"><button type="button" class="dialog-done" data-close>完成</button></footer></div></dialog>
  <script>
    const state={inputMonitoring:true,accessibility:new URLSearchParams(location.search).get('permissions')!=='warning',enabled:true};
    const dialog=document.getElementById('demo-dialog');
    const title=document.getElementById('dialog-title');
    const body=document.getElementById('dialog-body');
    let previousFocus=null,previousOverflow='';
    const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    function updatePermissions(){
      document.querySelectorAll('[data-status]').forEach(el=>{const granted=state[el.dataset.status];el.textContent=granted?'已授权':'未授权';el.classList.toggle('warning',!granted)});
      document.querySelectorAll('[data-permission]').forEach(el=>{el.setAttribute('aria-checked',String(state[el.dataset.permission]));el.closest('.demo-permission-row').querySelector('small').textContent=state[el.dataset.permission]?'示例状态：已授权':'示例状态：未授权'});
    }
    function showDialog(heading,content){
      title.textContent=heading;body.innerHTML=content;
      if(!dialog.open){previousFocus=document.activeElement;previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';dialog.showModal()}
      body.scrollTop=0;dialog.querySelector('[data-close]').focus();
    }
    function showPermissions(){
      showDialog('系统权限 · 状态示例',`<p class="dialog-description">切换下列开关，预览已授权与待授权状态。这里只改变本页显示，不读取或修改系统权限。</p>${[['inputMonitoring','输入监控'],['accessibility','辅助功能']].map(([key,label])=>`<div class="demo-permission-row"><div><strong>${label}</strong><small>示例状态</small></div><button type="button" class="switch" role="switch" aria-label="切换${label}示例" aria-checked="${state[key]}" data-permission="${key}"></button></div>`).join('')}<p class="dialog-footnote">正式应用将继续使用现有的系统授权与重新检测流程。</p>`);updatePermissions();
    }
    function showIntegration(){
      showDialog('集成设备 · 入口示例',`<p class="dialog-description">当前支持以下两类输入。正式应用中会打开对应的连接或权限设置。</p><div class="dialog-options"><button type="button" class="dialog-option" data-integrate="rc003">${icon('bluetooth')}<span><strong>小米遥控器 RC003</strong><small>蓝牙配对与现有驱动、权限引导。</small></span>${icon('chevron')}</button><button type="button" class="dialog-option" data-integrate="mouse">${icon('mouse')}<span><strong>系统鼠标</strong><small>全部物理鼠标共用同一套系统输入。</small></span>${icon('chevron')}</button></div><p class="dialog-footnote">本示例不会扫描、连接设备或安装驱动。</p>`);
    }
    function showDevice(device){
      const remote=device==='rc003';
      showDialog(`${remote?'小米遥控器':'系统鼠标'} · 编辑入口`, `<p class="dialog-description">从这里进入这类设备现有的映射编辑页，保留当前按键选择、动作泳道与行为库。</p><div class="dialog-info"><strong>当前配置：默认配置（示例）</strong><p>${remote?'继续编辑 RC003 按键的单击、双击和长按行为。':'继续编辑系统鼠标的按键、滚轮及屏幕区域映射；所有物理鼠标共用。'}</p></div><p class="dialog-footnote">此页只演示入口，不创建或改动映射配置。</p>`);
    }
    document.addEventListener('click',event=>{
      const target=event.target.closest('button');if(!target)return;
      if(target.hasAttribute('data-close')){dialog.close();return}
      if(target.dataset.permission){state[target.dataset.permission]=!state[target.dataset.permission];updatePermissions();return}
      if(target.dataset.device){showDevice(target.dataset.device);return}
      if(target.dataset.integrate){const remote=target.dataset.integrate==='rc003';showDialog(remote?'连接小米遥控器':'准备系统鼠标',`<p class="dialog-description">${remote?'正式应用会打开已有的设备连接引导：先在系统蓝牙设置中配对并唤醒 RC003，再按系统需要处理驱动或权限。':'正式应用会打开现有系统设置，检查输入监控、辅助功能等所需权限。'}</p><div class="dialog-info"><strong>浏览器中的入口演示</strong><p>此处不会请求系统授权或执行设备操作。</p></div>`);return}
      if(target.dataset.open==='permissions'){showPermissions();return}
      if(target.dataset.open==='integrate'){showIntegration();return}
      if(target.dataset.open==='settings'){showDialog('设置 · 入口示例','<p class="dialog-description">正式应用保留现有设置页面，用于管理启动偏好、系统权限、鼠标行为与数据备份。</p><p class="dialog-footnote">本页演示合并后的首页布局。</p>');return}
      if(target.dataset.open==='about'){showDialog('关于此方案','<p class="dialog-description">方案 B 将设备以近方形卡片并排展示在主区域，系统权限置于右侧辅助栏。设备映射是主要入口，权限信息保持低调且随时可处理。</p><p class="dialog-footnote">这是独立静态原型，没有访问本机设备或原生应用接口。</p>');return}
      if(target.id==='software-switch'){state.enabled=!state.enabled;target.setAttribute('aria-checked',String(state.enabled));document.getElementById('software-note').textContent=state.enabled?'':'示例：软件功能已暂停，仍可编辑配置。'}
    });
    dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()});
    dialog.addEventListener('close',()=>{document.body.style.overflow=previousOverflow;if(previousFocus?.isConnected)previousFocus.focus()});
    updatePermissions();
  </script>
</body>
</html>
