  <title id="device-title">TCL RC802A 按键区：正面与侧面</title>
  <desc id="device-description">依据用户实拍照片绘制，正面二十个输入，侧面三个输入。机身与应用标志已移除，应用键以 B 和 K 表示。仅有外观、稳定输入 ID 与精确热区，实际输入协议尚待采集，不能启用设备。</desc>
